<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Drum and Rice Lab</title>
<style>
:root{--navy:#12306f;--ink:#12263a;--yel:#ffd23f;--red:#d7261e;--blue:#1d5fd6;--green:#24963f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(11px,1.05vw,22px)}html,body{height:100%}
body{font-family:"Nunito","Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:#e9f1f8;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}button:disabled{opacity:.4;cursor:default}
.vi{display:block;font-weight:600;opacity:.72;font-size:.8em}
#hd{flex:none;display:flex;align-items:center;gap:.6rem;background:var(--navy);color:#fff;padding:.35rem .8rem;min-height:3.6rem}
.brand{font-weight:900;font-size:1.25rem;white-space:nowrap}.brand em{font-style:normal;color:var(--yel)}
.tabs{flex:1;display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap}
.tab{padding:.35rem .85rem;border-radius:999px;font-weight:900;background:rgba(255,255,255,.1);color:#c9d6f2;line-height:1.05;font-size:.95rem;text-align:center}
.tab b{display:inline-grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;background:rgba(255,255,255,.18);margin-right:.3rem;font-size:.8rem}
.tab.on{background:var(--yel);color:var(--navy)}.tab.on b{background:var(--navy);color:#fff}.tab.done b{background:var(--green);color:#fff}
.hbtn{background:rgba(255,255,255,.14);color:#fff;font-weight:800;padding:.4rem .8rem;border-radius:999px;white-space:nowrap}.hbtn.on{background:#fff;color:var(--navy)}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 31rem;gap:.7rem;padding:.7rem}
#stageW{position:relative;min-height:0;display:flex;flex-direction:column;gap:.5rem}
#cv{flex:1;min-height:0;width:100%;border-radius:1.2rem;background:#cfd9e2;touch-action:none;box-shadow:0 .4rem 1.2rem rgba(18,38,58,.18)}
.ctrl{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{background:#fff;border-radius:1rem;padding:.6rem 1.1rem;font-weight:900;font-size:1.1rem;box-shadow:0 .22rem 0 #c5d6e6;line-height:1.1}
.btn:active:not(:disabled){transform:translateY(.15rem);box-shadow:none}
.btn.gentle{background:#24963f;color:#fff;box-shadow:0 .22rem 0 #156428}.btn.hard{background:#d7261e;color:#fff;box-shadow:0 .22rem 0 #8f1610}.btn.go{background:var(--blue);color:#fff;box-shadow:0 .22rem 0 #123f94}
.tg{background:#fff;border-radius:999px;padding:.4rem .9rem;font-weight:800;border:.18rem solid #d5dde6;font-size:.95rem}.tg.on{border-color:var(--blue);background:#eaf2ff;color:var(--blue)}
#side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.6rem}
.card{background:#fff;border-radius:1.1rem;padding:.8rem 1rem;box-shadow:0 .3rem .9rem rgba(18,38,58,.1)}
.step h2{font-weight:900;font-size:1.45rem;line-height:1.1;margin-bottom:.35rem}.step h2 small{display:block;font-size:.8rem;color:var(--red);letter-spacing:.06em}
.step p{font-weight:700;font-size:1.08rem;line-height:1.3}
.cnt{display:flex;gap:.4rem;margin-top:.5rem;align-items:center;font-weight:900}.cnt i{width:1.6rem;height:1.6rem;border-radius:50%;background:#e3eaf1;display:grid;place-items:center;font-style:normal;font-size:.9rem}.cnt i.y{background:var(--green);color:#fff}
.opt{display:flex;gap:.6rem;margin-top:.5rem}
.opt button{flex:1;border-radius:1rem;padding:.6rem;font-weight:900;font-size:1.05rem;border:.25rem solid #d5dde6;background:#fff;line-height:1.15;text-align:left;display:flex;gap:.5rem;align-items:center}
.opt button i{font-style:normal;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;font-size:1.1rem}
.opt .a i{background:var(--red)}.opt .b i{background:var(--blue)}.opt button.on{border-color:var(--yel);background:#fff8d6}.opt button.ok{border-color:var(--green);background:#e6f7eb}.opt button.no{border-color:var(--red);background:#fde3df;opacity:.6}
.meters{display:grid;grid-template-columns:5.2rem 1fr;gap:.6rem;align-items:stretch}
.db{display:flex;flex-direction:column;align-items:center;gap:.2rem;font-weight:900}

.db .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#2fbf55,#ffd23f 60%,#e5432d);transition:height .05s}
.db .pk{position:absolute;left:0;right:0;height:.22rem;background:#fff}
.db b{font-size:1.3rem;font-variant-numeric:tabular-nums}.db small{font-size:.75rem;color:#5c6e80;text-align:center;line-height:1.05}
.scope{display:flex;flex-direction:column;gap:.2rem}.scope canvas{width:100%;height:9.5rem;border-radius:.7rem;background:#0d1b14}.scope small{font-weight:900;color:#5c6e80;font-size:.8rem}
.lbl{font-weight:900;font-size:.95rem;margin-bottom:.3rem;display:flex;justify-content:space-between}
table.res{width:100%;border-collapse:separate;border-spacing:0 .25rem;font-weight:800;font-size:.95rem}
table.res th{font-size:.78rem;color:#5c6e80;text-align:center;line-height:1.05}table.res td{text-align:center;background:#f2f6fa;padding:.25rem}
table.res td:first-child{border-radius:.5rem 0 0 .5rem}table.res td:last-child{border-radius:0 .5rem .5rem 0}
.tagG,.tagH{display:inline-block;border-radius:999px;padding:.05rem .55rem;color:#fff;font-size:.8rem}.tagG{background:var(--green)}.tagH{background:var(--red)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.cmp>div{border-radius:.9rem;padding:.5rem;text-align:center;font-weight:800}.cmp .g{background:#e6f7eb;border:.2rem solid #24963f}.cmp .h{background:#fde7e5;border:.2rem solid #d7261e}
.cmp b{display:block;font-size:1.2rem;font-weight:900}.cmp .g b{color:#24963f}.cmp .h b{color:#d7261e}
.bars{display:flex;flex-direction:column;gap:.25rem;margin-top:.3rem;text-align:left;font-size:.85rem}
.bars span{display:block;height:.8rem;border-radius:.4rem;background:currentColor;min-width:.3rem}
.q{margin-top:.5rem;font-weight:900}.q .opt button{justify-content:center;text-align:center}
.sent{font-size:1.15rem;font-weight:800;line-height:2.1}
.blank{display:inline-block;min-width:6.2rem;border-bottom:.2rem solid var(--ink);text-align:center;color:var(--blue);font-weight:900;line-height:1.3;margin:0 .15rem}.blank.cur{background:#fff8d6;box-shadow:0 0 0 .15rem var(--yel);border-radius:.4rem .4rem 0 0}.blank.ok{color:var(--green)}
.bank{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}.bank button{background:#fff;border-radius:999px;padding:.4rem 1rem;font-weight:900;border:.15rem solid #f2b400;box-shadow:0 .18rem 0 #e0c46a}
.flow{display:flex;align-items:center;gap:.3rem;justify-content:center;flex-wrap:wrap;margin:.5rem 0;font-weight:900;text-align:center;font-size:.95rem}
.flow span{border-radius:.7rem;padding:.35rem .6rem;line-height:1.1}.flow .f1{background:#dbeaff;color:#123f94}.flow .f2{background:#fff1b8;color:#6b5000}.flow .f3{background:#dcf5e3;color:#156428}.flow i{font-style:normal;color:var(--red)}
.big{background:linear-gradient(#fff4b0,#ffd23f);border-radius:999px;padding:.5rem 1rem;font-weight:900;text-align:center;font-size:1.1rem}
.big em{font-style:normal;color:var(--red)}
#toast{position:fixed;left:35%;bottom:5.5rem;transform:translateX(-50%) translateY(170%);background:var(--ink);color:#fff;font-weight:800;font-size:1.15rem;padding:.65rem 1.3rem;border-radius:1rem;max-width:60vw;text-align:center;transition:transform .25s;z-index:80}
#toast.on{transform:translateX(-50%) translateY(0)}#toast.bad{background:#a52c1c}#toast.ok{background:#1f7a3a}
@media (max-width:1000px){#main{grid-template-columns:1fr}#side{overflow:visible}body{overflow:auto}}
</style>
</head>
<body>
<header id="hd"><a class="hbtn" href="index.html" style="text-decoration:none">🏠</a><div class="brand">🥁 DRUM AND <em>RICE</em> LAB</div><div class="tabs" id="tabs"></div><button class="hbtn on" id="sndBtn">🔊</button><button class="hbtn" id="viBtn">Tiếng Việt</button></header>
<div id="main">
 <div id="stageW">
  <canvas id="cv"></canvas>
  <div class="ctrl">
   <button class="btn gentle" id="bG">👆 <span id="tG"></span></button>
   <button class="btn hard" id="bH">💥 <span id="tH"></span></button>
   <button class="tg" id="tSlow"></button><button class="tg on" id="tMag"></button><button class="tg" id="tReset"></button>
  </div>
 </div>
 <aside id="side">
  <div class="card step" id="stepC"></div>
  <div class="card"><div class="lbl"><span id="lMeter"></span><span id="lastTap" style="color:#5c6e80"></span></div>
   <div class="meters"><div class="db"><div class="bar"><div class="fill" id="dbF"></div><div class="pk" id="dbP"></div></div><b id="dbN">30</b><small>dB<br><span id="lLoud"></span></small></div>
   <div class="scope"><canvas id="sc" width="560" height="220"></canvas><small id="lScope"></small></div></div></div>
  <div class="card"><div class="lbl"><span id="lTable"></span></div><table class="res" id="res"></table></div>
 </aside>
</div>
<div id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let VI=false;try{VI=localStorage.getItem('race-vi')==='1'}catch(_){}
const L=(en,vi)=>VI?vi:en,bi=(en,vi)=>en+(VI?'<span class="vi">'+vi+'</span>':'');
function toast(m,k){const t=$('#toast');t.innerHTML=m;t.className='on '+(k||'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2800)}
/* ============ canvas & scene ============ */
const cv=$('#cv'),X=cv.getContext('2d');const W=1100,H=720;let SC=1;
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);SC=Math.min(cv.width/W,cv.height/H)}
window.addEventListener('resize',fit);
const D={cx:470,cy:350,rx:330,ry:112,h:196};
const HIT={u:.5,v:-.18};
const PXCM=12,G=981*PXCM;
// skin texture
const tex=document.createElement('canvas');tex.width=660;tex.height=224;{const t=tex.getContext('2d');let g=t.createRadialGradient(300,90,10,330,112,340);g.addColorStop(0,'#fbfbf7');g.addColorStop(.7,'#eeeee8');g.addColorStop(1,'#d9d9d2');t.fillStyle=g;t.beginPath();t.ellipse(330,112,330,112,0,0,7);t.fill();t.save();t.clip();for(let i=0;i<5000;i++){t.fillStyle='rgba('+(Math.random()<.5?'0,0,0':'255,255,255')+','+(Math.random()*.05)+')';const x=Math.random()*660,y=Math.random()*224;t.fillRect(x,y,2+Math.random()*3,1+Math.random()*2)}
 t.strokeStyle='rgba(0,0,0,.05)';t.lineWidth=10;t.beginPath();t.ellipse(330,112,300,100,0,0,7);t.stroke();t.restore()}
// rice
let RICE=[];
function makeRice(){RICE=[];for(let i=0;i<110;i++){const a=Math.random()*6.283,r=Math.pow(Math.random(),.7)*.42;RICE.push({u:Math.cos(a)*r-.05,v:Math.sin(a)*r*1+.05,h:0,vh:0,du:0,dv:0,a:Math.random()*3.14,tilt:Math.random()*.4,spin:0,air:false,shade:.85+Math.random()*.15,len:.85+Math.random()*.3,maxh:0})}}
makeRice();
/* vibration state (sim time) */
const V={F:0,t0:-99,amp:0,sim:0,speed:1,mag:true};
const TAU=.42,OM=2*Math.PI*9,OM2=2*Math.PI*14.5;
function env(){const dt=V.sim-V.t0;return dt<0?0:Math.exp(-dt/TAU)}
function skinZ(u,v){const dt=V.sim-V.t0;if(dt<0||dt>4)return 0;const e=Math.exp(-dt/TAU),r=Math.min(1,Math.hypot(u,v));return V.F*e*(Math.cos(Math.PI*r/2)*Math.sin(OM*dt)+.35*u*Math.sin(OM2*dt)*Math.exp(-dt/.25))}
function skinY(u,v){return D.cy+v*D.ry-(V.mag?skinZ(u,v)*14:0)}
/* stick */
const ST={lift:0,target:0,drag:false,strike:false,pend:0,butt:{x:1135,y:40}};
function tipPos(){const bx=D.cx+HIT.u*D.rx,by=D.cy+HIT.v*D.ry;return{x:bx+ST.lift*.25,y:by-12-ST.lift}}
/* ============ audio ============ */
let AC=null,MASTER=null,SOUND=true,NOISE=null;
function audio(){if(AC)return AC;try{AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(comp);comp.connect(AC.destination);
 NOISE=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(_){AC=null}return AC}
function drumSound(F){if(!SOUND||!audio())return;const t=AC.currentTime,amp=Math.pow(F,1.6);
 const o=AC.createOscillator();o.type='triangle';o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(140,t+.25);const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.75*amp,t+.004);g.gain.exponentialRampToValueAtTime(.0008,t+.32+F*.2);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.7);
 const o2=AC.createOscillator();o2.type='sine';o2.frequency.setValueAtTime(330,t);o2.frequency.exponentialRampToValueAtTime(250,t+.15);const g2=AC.createGain();g2.gain.setValueAtTime(.3*amp,t);g2.gain.exponentialRampToValueAtTime(.0005,t+.18);o2.connect(g2);g2.connect(MASTER);o2.start(t);o2.stop(t+.3);
 const n=AC.createBufferSource();n.buffer=NOISE;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1600+F*1400;bp.Q.value=.6;const gn=AC.createGain();gn.gain.setValueAtTime(.55*amp,t);gn.gain.exponentialRampToValueAtTime(.0005,t+.14+F*.12);n.connect(bp);bp.connect(gn);gn.connect(MASTER);n.start(t);n.stop(t+.5)}
let tickBudget=0;
function riceTick(imp){if(!SOUND||!AC||tickBudget<=0)return;tickBudget--;const t=AC.currentTime+Math.random()*.01,n=AC.createBufferSource();n.buffer=NOISE;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=3500+Math.random()*2500;const g=AC.createGain();g.gain.setValueAtTime(Math.min(.06,.012+imp*.05),t);g.gain.exponentialRampToValueAtTime(.0001,t+.012);n.connect(hp);hp.connect(g);g.connect(MASTER);n.start(t,Math.random()*.8);n.stop(t+.02)}
/* ============ measurement ============ */
const M={peakDb:30,curDb:30,lastPeak:30,hist:new Float32Array(560),hi:0,trial:null};
function dbFor(F){return Math.round(48+36*F)}
/* ============ hit ============ */
function hit(F){F=Math.max(.08,Math.min(1,F));V.F=F;V.t0=V.sim;drumSound(F);
 M.lastPeak=dbFor(F);M.peakDb=M.lastPeak;
 const vmax=Math.sqrt(2*G*8.5*PXCM);
 RICE.forEach(r=>{const rr=Math.min(1,Math.hypot(r.u,r.v)),sh=Math.cos(Math.PI*rr/2);r.vh=vmax*F*sh*(.7+Math.random()*.55);if(r.vh<20){r.vh=0;return}r.air=true;r.h=Math.max(r.h,.5);r.maxh=0;const sp=F*F*.35;r.du=(Math.random()-.5)*sp+(r.u)*sp*.3;r.dv=(Math.random()-.5)*sp+(r.v)*sp*.3;r.spin=(Math.random()-.5)*30*F});
 M.trial={F,cat:F<.5?'g':'h',db:M.lastPeak,h:0,t:V.sim,done:false};
 onTap(F)}
function finishTrial(){const t=M.trial;if(!t||t.done)return;t.done=true;const hs=RICE.map(r=>r.maxh).sort((a,b)=>b-a);t.h=Math.round(hs[Math.floor(hs.length*.1)]/PXCM*10)/10;recordTrial(t)}
/* ============ main loop ============ */
let last=performance.now();
function step(now){const rdt=Math.min(.05,(now-last)/1000);last=now;const dt=rdt*V.speed;V.sim+=dt;tickBudget=Math.min(6,tickBudget+rdt*60);
 // stick
 if(ST.strike){ST.lift-=rdt*2400*(V.speed<1?.35:1);if(ST.lift<=0){ST.lift=0;ST.strike=false;hit(ST.pend);ST.target=0}}
 else if(ST.raise){ST.lift+=(ST.target-ST.lift)*Math.min(1,rdt*(V.speed<1?4:12));if(Math.abs(ST.target-ST.lift)<3){ST.raise=false;ST.strike=true}}
 else if(!ST.drag){ST.lift+=((M.trial&&V.sim-V.t0<.15?ST.pend*30:0)-ST.lift)*Math.min(1,rdt*8)}
 // rice physics with substeps
 const n=4,h=dt/n;
 for(let s=0;s<n;s++)RICE.forEach(r=>{if(!r.air)return;r.vh-=G*h;r.h+=r.vh*h;r.u+=r.du*h;r.v+=r.dv*h;r.a+=r.spin*h*.4;r.tilt+=r.spin*h;
  const rr=Math.hypot(r.u,r.v);if(rr>.93){r.u*=.93/rr;r.v*=.93/rr;r.du*=-.5;r.dv*=-.5}
  if(r.h>r.maxh)r.maxh=r.h;
  if(r.h<=0){r.h=0;const imp=-r.vh/1500;riceTick(imp);const e=env()*V.F,sh=Math.cos(Math.PI*Math.min(1,rr)/2);
   if(e>.06){r.vh=Math.sqrt(2*G*8.5*PXCM)*e*sh*(.25+Math.random()*.5);if(r.vh<25){r.air=false;r.vh=0}}else if(-r.vh>160){r.vh=-r.vh*.25}else{r.air=false;r.vh=0;r.du*=.2;r.dv*=.2;r.tilt=Math.round(r.tilt/Math.PI)*Math.PI+.1*Math.random()}}});
 if(M.trial&&!M.trial.done&&V.sim-M.trial.t>1.4&&RICE.every(r=>!r.air))finishTrial();
 // meter
 const e=env();M.curDb=30+(M.peakDb-30)*Math.pow(e,.6);
 draw();drawMeters(rdt);requestAnimationFrame(step)}
/* ============ drawing ============ */
function chrome(x0,y0,x1,y1){const g=X.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'#6f7780');g.addColorStop(.18,'#f4f7fa');g.addColorStop(.32,'#9aa3ac');g.addColorStop(.55,'#ffffff');g.addColorStop(.75,'#8a939c');g.addColorStop(1,'#d9dfe4');return g}
function draw(){X.setTransform(1,0,0,1,0,0);X.fillStyle='#cfd9e2';X.fillRect(0,0,cv.width,cv.height);
 const ox=(cv.width/SC-W)/2,oy=(cv.height/SC-H)/2;X.setTransform(SC,0,0,SC,ox*SC,oy*SC);
 // room
 let g=X.createLinearGradient(0,-200,0,560);g.addColorStop(0,'#c6d3df');g.addColorStop(1,'#e6edf3');X.fillStyle=g;X.fillRect(-400,-300,W+800,860);
 X.fillStyle='rgba(255,255,255,.35)';X.fillRect(-400,120,W+800,6);
 g=X.createLinearGradient(0,555,0,H+200);g.addColorStop(0,'#c48a54');g.addColorStop(.25,'#a8703e');g.addColorStop(1,'#7a4f2a');X.fillStyle=g;X.fillRect(-400,555,W+800,500);
 X.strokeStyle='rgba(70,40,15,.18)';X.lineWidth=2;for(let i=0;i<14;i++){X.beginPath();X.moveTo(-400,575+i*14);X.bezierCurveTo(200,565+i*15,600,590+i*13,W+400,572+i*14);X.stroke()}
 X.fillStyle='rgba(255,255,255,.25)';X.fillRect(-400,555,W+800,3);
 const {cx,cy,rx,ry,h}=D;
 // shadow
 X.save();X.filter='blur(14px)';X.fillStyle='rgba(30,20,10,.45)';X.beginPath();X.ellipse(cx+20,cy+h+30,rx+20,ry*.55,0,0,7);X.fill();X.restore();
 // stand legs hint (small rubber feet)
 // shell
 X.save();X.beginPath();X.moveTo(cx-rx,cy);X.lineTo(cx-rx,cy+h);X.ellipse(cx,cy+h,rx,ry,0,Math.PI,0,true);X.lineTo(cx+rx,cy);X.ellipse(cx,cy,rx,ry,0,0,Math.PI,false);X.closePath();X.clip();
 g=X.createLinearGradient(cx-rx,0,cx+rx,0);[[0,'#071d52'],[.07,'#14368f'],[.2,'#2457c9'],[.27,'#6f9bff'],[.31,'#2b5fd6'],[.5,'#1a46b4'],[.7,'#2453c4'],[.83,'#4c7ff0'],[.88,'#a9c6ff'],[.92,'#2a59ca'],[1,'#061a4a']].forEach(s=>g.addColorStop(s[0],s[1]));X.fillStyle=g;X.fillRect(cx-rx,cy-ry,2*rx,h+2*ry);
 // metallic flake
 for(let i=0;i<500;i++){const a=(i*137.5)%360*Math.PI/180,xx=cx+Math.cos(a)*rx*.98,yy=cy+(i*53%h)+Math.sin(a)*ry;if(Math.sin(a)<0)continue;X.fillStyle='rgba(200,220,255,'+((i%7)/60)+')';X.fillRect(xx,yy,1.5,1.5)}
 g=X.createLinearGradient(0,cy,0,cy+h+ry);g.addColorStop(0,'rgba(0,0,0,.25)');g.addColorStop(.25,'rgba(0,0,0,0)');g.addColorStop(.85,'rgba(0,0,0,.05)');g.addColorStop(1,'rgba(0,0,0,.35)');X.fillStyle=g;X.fillRect(cx-rx,cy-ry,2*rx,h+2*ry);
 X.restore();
 // bottom hoop band

  $$('[data-q]').forEach(b=>b.onclick=()=>{LS.qa[+b.dataset.q]=b.dataset.k;if(b.dataset.k==='h')toast(L('Yes! Look at the results table.','Đúng! Hãy nhìn bảng kết quả.'),'ok');else toast(L('Check the results table again.','Xem lại bảng kết quả.'),'bad');if([0,1,2].every(i=>LS.qa[i]==='h'))LS.done[3]=1;labels();renderStep()})}
 if(s===4){const SEN=[['The harder I tap, the {} the sound.','Gõ càng mạnh, âm thanh càng ___.','louder'],['The harder I tap, the {} the rice moves.','Gõ càng mạnh, gạo nảy càng ___.','higher'],['The bigger the vibrations, the {} the sound.','Rung động càng lớn, âm thanh càng ___.','louder']];
  const cur=LS.fill.indexOf(null),VW={louder:'to',quieter:'nhỏ',higher:'cao',lower:'thấp'};
  C.innerHTML=hd(5,'Can you complete these sentences?','Em có thể hoàn thành các câu này không?')+SEN.map((s2,i)=>'<div class="sent">'+(i+1)+'. '+s2[0].replace('{}','<span class="blank'+(LS.fill[i]?' ok':'')+(i===cur?' cur':'')+'">'+(LS.fill[i]||'&nbsp;')+'</span>')+(VI?'<span class="vi" style="line-height:1.2">'+s2[1].replace('___',LS.fill[i]?VW[LS.fill[i]]:'___')+'</span>':'')+'</div>').join('')+
  (cur>=0?'<div class="bank">'+['louder','quieter','higher','lower'].map(w=>'<button data-w="'+w+'">'+w+(VI?' ('+VW[w]+')':'')+'</button>').join('')+'</div>':
  '<div class="flow"><span class="f1">'+L('HARDER TAP','GÕ MẠNH HƠN')+'</span><i>➜</i><span class="f2">'+L('BIGGER VIBRATIONS','RUNG ĐỘNG LỚN HƠN')+'</span><i>➜</i><span class="f3">'+L('LOUDER SOUND','ÂM THANH TO HƠN')+'</span></div><div class="big">'+L('The <em>harder</em> you tap the drum, the <em>bigger</em> the vibrations!','Gõ trống càng <em>mạnh</em>, rung động càng <em>lớn</em>!')+'</div><p style="margin-top:.5rem">'+(LS.pred==='A'?'✅ '+bi('Your prediction was right: the rice moves higher!','Dự đoán của em đúng: gạo nảy cao hơn!'):'🔄 '+bi('Your prediction was B. The evidence shows the rice moves HIGHER when we tap harder.','Em đã dự đoán B. Bằng chứng cho thấy gạo nảy CAO HƠN khi gõ mạnh hơn.'))+'</p><p style="font-size:.95rem;color:#5c6e80;margin-top:.3rem">🗣 '+bi('Read the sentences aloud together.','Cả lớp cùng đọc to các câu.')+'</p>');
  $$('[data-w]').forEach(b=>b.onclick=()=>{const w=b.dataset.w;if(w===SEN[cur][2]){LS.fill[cur]=w;if(LS.fill.every(Boolean)){LS.done[4]=1;labels()}renderStep()}else{toast(L('Look at your results again. Try another word.','Xem lại kết quả. Thử từ khác.'),'bad');b.style.opacity=.35}})}
 const n=$('#nx');if(n)n.onclick=()=>{LS.s=Math.min(4,s+1);labels();renderStep()}}
/* boot */
fit();labels();renderStep();renderTable();requestAnimationFrame(step);
setTimeout(fit,100);
