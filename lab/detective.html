<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Matter Detective Challenge</title>
<style>
:root{--navy:#12306f;--ink:#12263a;--yel:#ffd23f;--red:#e5432d;--blue:#2f86d6;--green:#2e9e4f;--line:#d5dde6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(12px,1.22vw,22px)}html,body{height:100%}
body{font-family:"Nunito","Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:#eaf3fb;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}button:disabled{opacity:.45;cursor:default}
img{-webkit-user-drag:none;pointer-events:none}
.vi{display:block;font-weight:600;opacity:.72;font-size:.78em}
#hd{flex:none;display:flex;align-items:center;gap:.8rem;background:var(--navy);color:#fff;padding:.4rem .9rem;min-height:4rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.2rem;white-space:nowrap}.brand img{width:2.4rem}.brand em{font-style:normal;color:var(--yel)}
#hdMid{flex:1;display:flex;align-items:center;gap:.7rem;justify-content:center;min-width:0}
.chip{display:flex;align-items:center;gap:.4rem;background:var(--c,#2f86d6);color:#fff;font-weight:900;padding:.25rem .9rem .25rem .3rem;border-radius:999px;white-space:nowrap}.chip img{width:2rem}
.mpips{display:flex;gap:.3rem}.mpips i{font-style:normal;font-weight:900;width:2.2rem;height:2.2rem;border-radius:.7rem;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#9fb0d6}.mpips i.now{box-shadow:0 0 0 .15rem #fff;color:#fff}.mpips i.done{background:var(--yel);color:var(--navy)}
.clock{font-weight:900;font-size:1.5rem;font-variant-numeric:tabular-nums;background:#0a1a40;color:var(--yel);padding:.1rem .8rem;border-radius:.7rem;min-width:6rem;text-align:center}
.miss{font-weight:900;background:rgba(255,255,255,.14);padding:.25rem .7rem;border-radius:999px}
.hbtn{background:rgba(255,255,255,.14);color:#fff;font-weight:800;padding:.45rem .9rem;border-radius:999px;white-space:nowrap}.hbtn.on{background:#fff;color:var(--navy)}
#app{flex:1;min-height:0;overflow:auto;padding:.9rem 1.1rem;display:flex;flex-direction:column;gap:.7rem}
#app.center{align-items:center;justify-content:center}
.card{background:#fff;border-radius:1.3rem;box-shadow:0 .4rem 1.2rem rgba(18,38,58,.12);padding:1.2rem 1.5rem}
.btn{background:#e8f1fa;border-radius:1rem;padding:.65rem 1.2rem;font-weight:900;font-size:1.1rem;box-shadow:0 .22rem 0 #c5d6e6;line-height:1.15}
.btn:active:not(:disabled){transform:translateY(.15rem);box-shadow:none}
.btn.go{background:var(--green);color:#fff;box-shadow:0 .22rem 0 #17602d}.btn.big{font-size:1.4rem;padding:.85rem 2rem}.btn.on{background:var(--blue);color:#fff;box-shadow:0 .22rem 0 #1c5fa0}
.title{font-weight:900;font-size:2.3rem;text-align:center;line-height:1.1}
.banner{font-weight:900;font-size:2.5rem;color:#fff;background:linear-gradient(#1c3f8f,#12306f);border-radius:999px;padding:.35rem 2rem;box-shadow:0 .3rem 0 #0b1e48;text-align:center}.banner em{font-style:normal;color:var(--yel)}
.ribbon{display:inline-block;background:var(--yel);color:var(--navy);font-weight:900;font-size:1.4rem;padding:.2rem 1.4rem;border-radius:.4rem;transform:rotate(-1deg)}
.mcards{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.mc3{width:18rem;background:#fff;border-radius:1.3rem;border:.25rem solid #9cc6ee;padding:1rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center}
.mc3 img{width:5rem}.mc3 small{font-weight:900;color:#fff;background:var(--navy);border-radius:999px;padding:.15rem .9rem}.mc3 b{font-size:1.3rem;font-weight:900}.mc3 p{font-weight:700;color:#5c6e80;font-size:.95rem}
.field{display:flex;flex-direction:column;gap:.35rem;font-weight:900;width:100%}
.field input{font:inherit;font-weight:900;font-size:1.6rem;padding:.55rem .9rem;border-radius:1rem;border:.18rem solid var(--line);width:100%}
.mascots{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}.mascots button{width:3.9rem;height:3.9rem;border-radius:1.1rem;background:#f2f6fa;display:grid;place-items:center;border:.25rem solid transparent}.mascots button img{width:2.9rem}.mascots button.on{border-color:var(--c);background:#fff;box-shadow:0 0 0 .2rem var(--c)}
.err{color:var(--red);font-weight:800;min-height:1.3rem;text-align:center}
.foot{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.mhead{display:flex;align-items:center;gap:.8rem;flex:none;flex-wrap:wrap}
.mhead .badge{background:var(--navy);color:#fff;font-weight:900;padding:.35rem 1rem;border-radius:999px;font-size:1.15rem;display:flex;align-items:center;gap:.4rem}.mhead .badge img{width:1.8rem}
.mhead .nm{font-weight:900;font-size:1.6rem;background:var(--yel);padding:.1rem 1rem;border-radius:.4rem}
.mhead .step{margin-left:auto;font-weight:900;color:#5c6e80}
.task{font-weight:900;font-size:1.3rem;text-align:center}
.hint{font-weight:700;color:#5c6e80;text-align:center}
.cv{width:100%;max-width:64rem;align-self:center;display:block;border-radius:1.2rem;touch-action:none}
.tools{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.tools .btn{font-size:1rem}
.ptable{border-collapse:separate;border-spacing:.35rem;background:#fff;border-radius:1.2rem;padding:.5rem;box-shadow:0 .3rem 1rem rgba(18,38,58,.1);align-self:center}
.ptable th{font-weight:900;padding:.3rem .6rem;font-size:1.05rem;text-align:center;line-height:1.1;color:#fff;border-radius:.7rem}
.ptable th.p{background:var(--navy)}.ptable th.s{background:#2f7fe0}.ptable th.l{background:#f2b400;color:var(--ink)}.ptable th.g{background:#3fae2a}
.ptable td.q{font-weight:900;padding:0 .6rem;font-size:1.05rem;line-height:1.1}
.cell{width:6.6rem;height:3.2rem;border-radius:.8rem;font-size:1.8rem;font-weight:900;background:#eef3f8;color:#9fb3c6}.cell.y{background:#d9f5e1;color:#1f7a3a}.cell.n{background:#fde3df;color:#a52c1c}.cell.bad{box-shadow:0 0 0 .25rem var(--red)}
.notebook{display:grid;grid-template-columns:auto 1fr 1fr;gap:.35rem;background:#fffdf2;border:.2rem solid #f2d27a;border-radius:1rem;padding:.6rem;align-self:center;font-weight:800;min-width:30rem}
.notebook b{font-weight:900;text-align:center}.notebook span{background:#fff;border-radius:.6rem;padding:.3rem .5rem;text-align:center;min-height:2.2rem;display:flex;align-items:center;justify-content:center;line-height:1.1;font-size:.95rem}
.pick{display:flex;gap:.4rem;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:900}
.pick button{background:#fff;border-radius:1rem;padding:.4rem .8rem;display:flex;align-items:center;gap:.4rem;font-weight:900;border:.22rem solid #dbe6f0;line-height:1.1}.pick button img{width:2.4rem}.pick button.on{border-color:var(--blue);background:#eaf3fd}
.mcq{display:flex;flex-direction:column;gap:.5rem;max-width:52rem;width:100%;align-self:center}
.mcq button{background:#fff;border-radius:1rem;padding:.7rem 1rem;font-weight:800;font-size:1.15rem;text-align:left;border:.22rem solid #dbe6f0;display:flex;gap:.7rem;align-items:center;line-height:1.2}
.mcq button i{font-style:normal;flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--yel);display:grid;place-items:center;font-weight:900}
.mcq button.no{opacity:.4;border-color:var(--red);text-decoration:line-through}.mcq button.ok{border-color:var(--green);background:#e6f7eb}
.explain{max-width:58rem;width:100%;background:#fff8d6;border:.25rem solid #f2b400;border-radius:1.4rem;padding:1.1rem 1.4rem;display:flex;flex-direction:column;gap:.7rem;align-items:center;text-align:center;align-self:center}
.explain h3{font-weight:900;color:#a36b00}.explain .q{font-size:1.3rem;font-weight:900}
.sent{font-size:1.5rem;font-weight:800;line-height:1.9}
.blank{display:inline-block;min-width:7rem;border-bottom:.22rem solid var(--ink);padding:0 .4rem;margin:0 .2rem;color:var(--blue);font-weight:900;line-height:1.3}.blank.cur{background:#fff;border-radius:.5rem .5rem 0 0;box-shadow:0 0 0 .15rem var(--yel)}.blank.ok{color:var(--green)}
.bank{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}.bank button{background:#fff;border-radius:999px;padding:.45rem 1.05rem;font-weight:900;font-size:1.1rem;box-shadow:0 .2rem 0 #e0c46a;border:.15rem solid #f2b400;line-height:1.1}.bank button.used{opacity:.3}
.loads{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;min-height:5.5rem}
.ld{background:#fff;border-radius:1rem;padding:.4rem .7rem;display:flex;flex-direction:column;align-items:center;box-shadow:0 .25rem .6rem rgba(18,38,58,.15);border:.22rem solid transparent;width:8rem;text-align:center;font-weight:900;font-size:.9rem;line-height:1.1}.ld img{width:3.2rem}.ld.sel{border-color:var(--yel);box-shadow:0 0 0 .25rem var(--yel)}
.fleet{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.veh{width:18rem;background:linear-gradient(#cfe0ee,#9fb6c8);border-radius:1.2rem;padding:.5rem;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:.25rem solid transparent;position:relative}
.veh svg{width:100%}.veh b{font-weight:900}.veh .cargo{display:flex;gap:.2rem;position:absolute;top:.5rem;left:1rem}.veh .cargo img{width:2.2rem}
.split{display:flex;gap:1rem;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.split .cv{flex:1 1 30rem;max-width:40rem}
.side{flex:1 1 24rem;max-width:34rem;display:flex;flex-direction:column;gap:.6rem}
.case{background:#fffdf2;border:.25rem solid #c9a24a;border-radius:1.3rem;padding:1.2rem 1.6rem;max-width:50rem;width:100%;display:flex;flex-direction:column;gap:.7rem;align-items:center;text-align:center;position:relative}
.case .stamp{position:absolute;right:1.2rem;top:1rem;transform:rotate(12deg);border:.3rem solid var(--red);color:var(--red);font-weight:900;font-size:1.4rem;padding:.2rem .8rem;border-radius:.5rem;opacity:.85}
.case table{border-collapse:collapse;width:100%;font-weight:800}.case td{padding:.4rem .6rem;border-bottom:.12rem dashed #e0cfa0;text-align:left}.case td:last-child{text-align:right;font-size:1.3rem;white-space:nowrap}
.stars{color:#f2b400;letter-spacing:.1em}.stars s{color:#d9dee3;text-decoration:none}
.glow{width:10rem;height:10rem;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#fff8c4,#ffd23f 60%,#f2b400);box-shadow:0 0 3rem #ffd23f}.glow img{width:7rem;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-.6rem) rotate(-5deg)}}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(150%);background:var(--ink);color:#fff;font-weight:800;font-size:1.15rem;padding:.7rem 1.4rem;border-radius:1rem;max-width:90vw;text-align:center;transition:transform .25s;z-index:80;box-shadow:0 .6rem 1.5rem rgba(0,0,0,.3)}
#toast.on{transform:translateX(-50%) translateY(0)}#toast.bad{background:#a52c1c}#toast.ok{background:#1f7a3a}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-.5rem)}40%,80%{transform:translateX(.5rem)}}
.conf{position:fixed;top:-3rem;width:2.2rem;animation:fall 2.2s ease-in forwards;pointer-events:none;z-index:95}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:.2}}
</style>
</head>
<body>
<header id="hd"><div class="brand"><img src="race-img/detective.webp" alt="">MATTER <em>DETECTIVE</em></div><div id="hdMid"></div><button class="hbtn" id="viBtn">Tiếng Việt</button></header>
<main id="app"></main>
<div id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const IMG=k=>'race-img/'+k+'.webp',im=k=>'<img src="'+IMG(k)+'" alt="">';
const pre={};function li(k){if(!pre[k]){pre[k]=new Image();pre[k].src=IMG(k)}return pre[k]}
let VI=false;try{VI=localStorage.getItem('race-vi')==='1'}catch(_){}
const bi=(en,vi)=>en+(VI&&vi?'<span class="vi">'+vi+'</span>':'');
const T=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(_){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const MASC=['detective','magnifier','monocle','rocket','star','bulb','diamond','seed'],MCOL=['#8a5a2b','#2f86d6','#8e44ad','#e5432d','#c79a00','#e39b00','#139c9c','#2e9e4f'];
const MIS=[{n:['Compare the States','So sánh các thể'],ic:'clipboard',d:['Test a solid, a liquid and a gas. Then complete the table.','Thử nghiệm chất rắn, lỏng, khí. Rồi hoàn thành bảng.']},
 {n:['Transport Detective','Thám tử vận chuyển'],ic:'truck',d:['Why can scrap metal go in an open lorry, but liquid waste cannot?','Tại sao sắt vụn đi xe tải thùng hở được, còn rác lỏng thì không?']},
 {n:['Tricky Materials','Vật liệu khó'],ic:'tube',d:['Sand can flow. A sponge can be squashed. Are they still solids?','Cát chảy được. Bọt biển nén được. Chúng vẫn là chất rắn chứ?']}];
let S=store.get('mdc'),LOOP=null,STEP=null;
function save(){store.set('mdc',S)}
function toast(m,k){const t=$('#toast');t.innerHTML=m;t.className='on '+(k||'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2800)}
function confetti(n){for(let i=0;i<(n||26);i++){const s=document.createElement('img');s.src=IMG(['star','magnifier','badge','party'][i%4]);s.className='conf';s.style.left=(Math.random()*95)+'vw';s.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2900)}}
function wrong(why,el){S.miss[S.m]++;save();toast('🔎 '+why,'bad');if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}hdr()}
function elapsed(){return S&&S.t0?((S.tEnd||Date.now())-S.t0)/1000:0}
function hdr(){const m=$('#hdMid');$('#viBtn').classList.toggle('on',VI);
 if(!S||!S.name||S.view==='start'){m.innerHTML='';return}
 m.innerHTML='<span class="chip" style="--c:'+S.col+'">'+im(S.ic)+S.name+'</span><div class="mpips">'+[0,1,2].map(i=>'<i class="'+(S.done[i]?'done':'')+(S.m===i&&S.view==='play'?' now':'')+'">'+(i+1)+'</i>').join('')+'</div><span class="clock" id="clk">'+T(elapsed())+'</span><span class="miss">🔎 '+(VI?'Lỗi':'Mistakes')+': '+S.miss.reduce((a,b)=>a+b,0)+'</span>'}
setInterval(()=>{const c=$('#clk');if(c)c.textContent=T(elapsed())},500);
$('#viBtn').onclick=()=>{VI=!VI;try{localStorage.setItem('race-vi',VI?'1':'0')}catch(_){}render()};
function stop(){if(LOOP){cancelAnimationFrame(LOOP);LOOP=null}}
function anim(fn){stop();let last=performance.now();const f=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;fn(dt,now/1000);LOOP=requestAnimationFrame(f)};LOOP=requestAnimationFrame(f)}
function render(){stop();hdr();const A=$('#app');A.className='';
 if(!S||!S.name)return vStart(A);
 if(S.view==='menu')return vMenu(A);
 if(S.view==='play')return [m1,m2,m3][S.m](A);
 if(S.view==='case')return vCase(A)}
function head(i,step){return '<div class="mhead"><span class="badge">'+im(MIS[i].ic)+bi('MISSION '+(i+1),'NHIỆM VỤ '+(i+1))+'</span><span class="nm">'+bi(MIS[i].n[0],MIS[i].n[1])+'</span><span class="step">'+step+'</span></div>'}
/* ---------- start ---------- */
let JN={name:'',ic:0};
function vStart(A){A.className='center';
 A.innerHTML='<div class="banner">MATTER DETECTIVE <em>CHALLENGE!</em></div><span class="ribbon">'+bi('3 MISSIONS · ONE SCIENCE TEAM','3 NHIỆM VỤ · MỘT ĐỘI KHOA HỌC')+'</span><div class="mcards">'+MIS.map((m,i)=>'<div class="mc3">'+im(m.ic)+'<small>'+bi('MISSION '+(i+1),'NHIỆM VỤ '+(i+1))+'</small><b>'+bi(m.n[0],m.n[1])+'</b><p>'+bi(m.d[0],m.d[1])+'</p></div>').join('')+'</div>'+
 '<div class="card" style="max-width:40rem;width:100%;display:flex;flex-direction:column;gap:.7rem;align-items:center"><label class="field">'+bi('Detective team name','Tên đội thám tử')+'<input id="nm" maxlength="16" autocomplete="off" placeholder="Team Sherlock" value="'+JN.name+'"></label><div class="mascots">'+MASC.map((k,i)=>'<button data-m="'+i+'" style="--c:'+MCOL[i]+'" class="'+(JN.ic===i?'on':'')+'">'+im(k)+'</button>').join('')+'</div><div class="err" id="er"></div><button class="btn go big" id="go">🔍 '+bi('Open the case','Mở hồ sơ vụ án')+'</button></div>';
 $$('.mascots button').forEach(b=>b.onclick=()=>{JN.ic=+b.dataset.m;$$('.mascots button').forEach(x=>x.classList.toggle('on',x===b))});
 $('#go').onclick=()=>{JN.name=$('#nm').value.trim();if(!JN.name){$('#er').textContent=VI?'Hãy nhập tên đội.':'Type your team name.';return}
  S={name:JN.name.slice(0,16),ic:MASC[JN.ic],col:MCOL[JN.ic],m:0,view:'menu',done:[0,0,0],miss:[0,0,0],t0:Date.now(),tEnd:null,ans:{}};save();render()}}
function vMenu(A){A.className='center';const nx=S.done.indexOf(0);
 A.innerHTML='<div class="title">'+bi('Case board','Bảng vụ án')+'</div><div class="mcards">'+MIS.map((m,i)=>'<div class="mc3" style="'+(S.done[i]?'border-color:#2e9e4f;background:#effaf2':i===nx?'border-color:#ffd23f;box-shadow:0 0 0 .3rem rgba(255,210,63,.5)':'opacity:.6')+'">'+im(m.ic)+'<small>'+bi('MISSION '+(i+1),'NHIỆM VỤ '+(i+1))+'</small><b>'+bi(m.n[0],m.n[1])+'</b><p>'+(S.done[i]?'✅ '+bi('Solved','Đã giải'):bi(m.d[0],m.d[1]))+'</p></div>').join('')+'</div>'+
 (nx>=0?'<button class="btn go big" id="go">🔍 '+bi('Start Mission '+(nx+1),'Bắt đầu nhiệm vụ '+(nx+1))+'</button>':'');
 const g=$('#go');if(g)g.onclick=()=>{S.m=nx;S.view='play';STEP=null;save();render()}}
function finishMission(){S.done[S.m]=1;confetti();if(S.done.every(Boolean)){S.tEnd=Date.now();S.view='case'}else S.view='menu';STEP=null;save();toast(VI?'Nhiệm vụ hoàn thành! 🏅':'Mission solved! 🏅','ok');render()}
/* ---------- word-bank explain ---------- */
function explain(A,hd,e,onDone){if(!STEP.fill){STEP.fill=e.a.map(()=>null);STEP.bank=shuf(e.a.concat(e.x))}
 const cur=STEP.fill.indexOf(null);let n=0;
 const sent=e.s.replace(/\{\}/g,()=>{const k=n++;return '<span class="blank'+(STEP.fill[k]?' ok':'')+(k===cur?' cur':'')+'">'+(STEP.fill[k]||'&nbsp;')+'</span>'});
 A.innerHTML=hd+'<div class="explain"><h3>🗣 '+bi('EXPLAIN! Build the sentence, then read it aloud as a team.','GIẢI THÍCH! Ghép câu, rồi cả đội cùng đọc to.')+'</h3><p class="q">'+bi(e.q[0],e.q[1])+'</p><div class="sent">'+sent+'</div>'+(VI?'<div style="font-weight:700;opacity:.75">'+e.sv+'</div>':'')+(cur>=0?'<div class="bank">'+STEP.bank.map(w=>'<button data-w="'+w+'" class="'+(STEP.fill.includes(w)?'used':'')+'">'+w+'</button>').join('')+'</div>':'<button class="btn go big" id="exd">✓ '+bi('We read it aloud!','Đã đọc to!')+'</button>')+'</div>';
 $$('[data-w]').forEach(b=>b.onclick=()=>{const w=b.dataset.w;if(STEP.fill.includes(w))return;if(w===e.a[cur]){STEP.fill[cur]=w;render()}else wrong(VI?'Từ đó chưa đúng chỗ này.':'That word does not fit there.',b)});
 const d=$('#exd');if(d)d.onclick=onDone}
