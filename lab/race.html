<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Waste Sorting Race</title>
<style>
:root{--navy:#12263a;--yel:#ffd23f;--red:#e5432d;--blue:#2f86d6;--green:#2e9e4f;--line:#d5dde6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(12px,1.22vw,22px)}
html,body{height:100%}
body{font-family:"Nunito","Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--navy);background:#eef4f9;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:disabled{opacity:.45;cursor:default}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.vi{display:block;font-weight:600;opacity:.72;font-size:.78em}
#hd{flex:none;display:flex;align-items:center;gap:.8rem;background:var(--navy);color:#fff;padding:.45rem .9rem;min-height:4rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.25rem;white-space:nowrap}.brand img{width:2.2rem}
.brand em{font-style:normal;color:var(--yel)}
#hdMid{flex:1;display:flex;align-items:center;gap:.8rem;justify-content:center;min-width:0}
.chip{display:flex;align-items:center;gap:.4rem;background:var(--c,#2f86d6);color:#fff;font-weight:900;padding:.25rem .9rem .25rem .3rem;border-radius:999px;font-size:1.05rem;white-space:nowrap}.chip img{width:2rem}
.prog{display:flex;gap:.3rem}.prog i{width:2.3rem;height:2.3rem;border-radius:.7rem;background:rgba(255,255,255,.12);display:grid;place-items:center}.prog i img{width:1.8rem;filter:grayscale(1);opacity:.3}.prog i.got{background:rgba(255,210,63,.25);box-shadow:0 0 0 .15rem var(--yel)}.prog i.got img{filter:none;opacity:1}.prog i.now{box-shadow:0 0 0 .15rem #fff}
.clock{font-weight:900;font-size:1.7rem;font-variant-numeric:tabular-nums;background:#0a1826;color:var(--yel);padding:.1rem .8rem;border-radius:.7rem;min-width:6.5rem;text-align:center}
.net{font-size:.75rem;font-weight:800;padding:.2rem .6rem;border-radius:999px;background:#2b3e52}.net.on{background:#1f7a3a}.net.off{background:#a52c1c}
.hbtn{background:rgba(255,255,255,.14);color:#fff;font-weight:800;padding:.45rem .9rem;border-radius:999px;white-space:nowrap}.hbtn.on{background:#fff;color:var(--navy)}
#app{flex:1;min-height:0;overflow:auto;padding:.9rem;display:flex;flex-direction:column;gap:.7rem}
.center{align-items:center;justify-content:center}
.card{background:#fff;border-radius:1.3rem;box-shadow:0 .4rem 1.2rem rgba(18,38,58,.12);padding:1.2rem 1.5rem}
.btn{background:#e8f1fa;border-radius:1rem;padding:.7rem 1.3rem;font-weight:900;font-size:1.15rem;box-shadow:0 .22rem 0 #c5d6e6;line-height:1.15}
.btn:active:not(:disabled){transform:translateY(.15rem);box-shadow:none}
.btn.go{background:var(--green);color:#fff;box-shadow:0 .22rem 0 #17602d}.btn.red{background:var(--red);color:#fff;box-shadow:0 .22rem 0 #a52c1c}.btn.big{font-size:1.45rem;padding:.9rem 2rem}
.btn.on{background:var(--blue);color:#fff;box-shadow:0 .22rem 0 #1c5fa0}
.title{font-weight:900;font-size:2.4rem;text-align:center;line-height:1.1}
.banner{font-weight:900;font-size:2.6rem;color:#fff;background:linear-gradient(#1c3f8f,#12306f);border-radius:999px;padding:.35rem 2.2rem;box-shadow:0 .3rem 0 #0b1e48;text-align:center;display:flex;align-items:center;gap:.8rem}.banner em{font-style:normal;color:var(--yel)}.banner img{width:3rem}
.ltce{display:flex;gap:.4rem;align-items:center;justify-content:center;flex-wrap:wrap}.ltce span{padding:.3rem 1rem;border-radius:999px;font-weight:900;background:#e3eaf1;color:#8493a3;text-align:center;line-height:1.1}.ltce i{font-style:normal;color:var(--red);font-weight:900}
.ltce .l.on{background:#cfe6ff;color:#0d3a6b}.ltce .t.on{background:#ffe680;color:#5a4300}.ltce .c.on{background:#bff0d4;color:#0e5130}.ltce .e.on{background:#ffc9d6;color:#6b1230}.ltce span.now{box-shadow:0 0 0 .2rem var(--navy)}
.roles{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:center}
.role{width:22rem;background:#fff;border-radius:1.5rem;padding:1.4rem;box-shadow:0 .5rem 1.4rem rgba(18,38,58,.14);display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center;border:.25rem solid transparent}
.role img{width:7rem}.role b{font-size:1.5rem;font-weight:900}.role p{font-weight:700;color:#5c6e80}
.role:active{border-color:var(--yel)}
.field{display:flex;flex-direction:column;gap:.35rem;font-weight:900}
.field input{font:inherit;font-weight:900;font-size:1.6rem;padding:.55rem .9rem;border-radius:1rem;border:.18rem solid var(--line);text-transform:none;width:100%}
.field input.code{text-transform:uppercase;letter-spacing:.4em;text-align:center;font-size:2.4rem}
.mascots{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}.mascots button{width:4.6rem;height:4.6rem;border-radius:1.1rem;background:#f2f6fa;display:grid;place-items:center;border:.25rem solid transparent}.mascots button img{width:3.4rem}.mascots button.on{border-color:var(--c);background:#fff;box-shadow:0 0 0 .2rem var(--c)}
.err{color:var(--red);font-weight:800;min-height:1.4rem;text-align:center}
.lobby img.spin{width:8rem;animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-1rem) rotate(-6deg)}}
.routemap{display:flex;align-items:center;justify-content:center;gap:.2rem;flex-wrap:wrap}
.node{display:flex;flex-direction:column;align-items:center;width:7.5rem;text-align:center;font-weight:800;font-size:.85rem;line-height:1.1;gap:.2rem}
.node .o{width:4.2rem;height:4.2rem;border-radius:50%;background:#fff;display:grid;place-items:center;border:.3rem solid #c9d3dc}.node .o img{width:2.9rem;filter:grayscale(1);opacity:.4}
.node.done .o{border-color:var(--green);background:#e6f7eb}.node.done .o img{filter:none;opacity:1}.node.next .o{border-color:var(--yel);box-shadow:0 0 0 .35rem rgba(255,210,63,.45);animation:pulse 1.3s infinite}.node.next .o img{filter:none;opacity:1}
@keyframes pulse{50%{box-shadow:0 0 0 .7rem rgba(255,210,63,.15)}}
.road{width:2rem;height:.5rem;border-radius:999px;background:repeating-linear-gradient(90deg,#5b6470 0 .5rem,#fff .5rem .75rem);margin-bottom:1.6rem}
.clue{max-width:54rem;width:100%;border-top:1.3rem solid var(--yel);display:flex;flex-direction:column;gap:.8rem;align-items:center;text-align:center}
.ri{font-weight:900;letter-spacing:.18em;font-size:1.5rem}.ri small{display:block;letter-spacing:.04em;color:var(--red);font-size:.9rem}
.clue h3{font-size:1.6rem;font-weight:900;line-height:1.25}
.clue .hero{width:7rem}
.lt2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;width:100%}.lt2 div{background:#f2f6fa;border-radius:1rem;padding:.65rem;font-weight:700}.lt2 b{display:block;font-weight:900}
.prize{display:flex;align-items:center;gap:.5rem;font-weight:800}.prize img{width:2.6rem}
.sthead{display:flex;align-items:center;gap:.8rem;flex:none;flex-wrap:wrap}
.sthead .nm{flex:1;line-height:1.1;min-width:14rem}.sthead small{display:block;color:var(--red);font-weight:900;letter-spacing:.06em}.sthead b{font-size:1.6rem;font-weight:900}
.stt{font-weight:900;font-size:1.1rem;background:#fff;border-radius:.8rem;padding:.3rem .8rem;font-variant-numeric:tabular-nums}.stt.over{background:var(--red);color:#fff}
.part{font-weight:900;color:#5c6e80;font-size:1rem;letter-spacing:.04em}
.task{font-weight:900;font-size:1.3rem;text-align:center}
.foot{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(150%);background:var(--navy);color:#fff;font-weight:800;font-size:1.15rem;padding:.7rem 1.4rem;border-radius:1rem;max-width:90vw;text-align:center;transition:transform .25s;z-index:80;box-shadow:0 .6rem 1.5rem rgba(0,0,0,.3)}
#toast.on{transform:translateX(-50%) translateY(0)}#toast.bad{background:#a52c1c}#toast.ok{background:#1f7a3a}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-.5rem)}40%,80%{transform:translateX(.5rem)}}
.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
/* station 1 conveyor */
.plant{position:relative;background:linear-gradient(#5a6f82,#7e93a6);border-radius:1.3rem;padding:1rem 1rem 0;overflow:hidden}
.belt{position:relative;height:9.5rem;margin:0 -1rem}
.belt .track{position:absolute;left:0;right:0;bottom:.6rem;height:2rem;background:repeating-linear-gradient(90deg,#2b3035 0 1.6rem,#3d444b 1.6rem 3.2rem);border-top:.3rem solid #9aa4ad;border-bottom:.3rem solid #1d2126;animation:belt .5s linear infinite}
@keyframes belt{to{background-position:3.2rem 0}}
.belt .roll{position:absolute;bottom:0;width:2.8rem;height:2.8rem;border-radius:50%;background:radial-gradient(#cfd6dc,#59626a);border:.2rem solid #2b3035}
.bitem{position:absolute;bottom:2.6rem;width:7.2rem;display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:grab;z-index:3}
.bitem img{width:5rem;filter:drop-shadow(0 .4rem .3rem rgba(0,0,0,.35))}
.bitem span{background:#fff;border-radius:.6rem;padding:.05rem .5rem;font-weight:900;font-size:.85rem;white-space:nowrap;box-shadow:0 .15rem .3rem rgba(0,0,0,.2);text-align:center;line-height:1.1}
.bitem.sel img{filter:drop-shadow(0 0 .5rem #ffd23f) drop-shadow(0 0 .3rem #ffd23f)}.bitem.sel span{background:var(--yel)}
.bins{display:flex;gap:1.6rem;justify-content:center;align-items:flex-end;padding:.6rem 0 0}
.wbin{width:12rem;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.wbin .lid{width:104%;height:1.6rem;border-radius:.7rem .7rem .3rem .3rem;background:linear-gradient(var(--b1),var(--b2));box-shadow:inset 0 .2rem 0 rgba(255,255,255,.35)}
.wbin .bd{width:92%;min-height:10.5rem;background:linear-gradient(90deg,var(--b2),var(--b1) 30%,var(--b1) 65%,var(--b2));clip-path:polygon(0 0,100% 0,94% 100%,6% 100%);display:flex;flex-direction:column;align-items:center;padding:.7rem .4rem;gap:.3rem}
.wbin .lab{background:#fff;border-radius:.8rem;padding:.3rem .8rem;text-align:center;line-height:1}.wbin .lab img{width:3rem}.wbin .lab b{display:block;font-weight:900;font-size:1.35rem}
.wbin .n{font-weight:900;color:#fff;font-size:1.1rem;text-shadow:0 .1rem .2rem rgba(0,0,0,.4)}
.wbin .wh{display:flex;justify-content:space-between;width:72%;margin-top:-.4rem}.wbin .wh i{width:1.3rem;height:1.3rem;border-radius:50%;background:#1d2126}
.wbin.hot .lid{box-shadow:0 0 0 .3rem #fff}
.b-solid{--b1:#2f7fe0;--b2:#1a56a6}.b-liquid{--b1:#ffc61a;--b2:#d99a00}.b-gas{--b1:#53c52a;--b2:#2f8c14}
.fly{position:fixed;z-index:70;transition:all .45s ease-in;pointer-events:none}
.scorebar{display:flex;gap:1rem;justify-content:center;font-weight:900;font-size:1.15rem}.scorebar span{background:#fff;border-radius:999px;padding:.3rem 1rem}
/* station 2 */
.jars{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap}
.jar{display:flex;flex-direction:column;align-items:center;gap:.4rem}.jar canvas{width:13rem;background:#2a3f55;border-radius:1rem}
.jar .lbl{font-weight:900;font-size:1.3rem}
.pick3{display:flex;gap:.3rem}.pick3 button{background:#e8f1fa;border-radius:.7rem;padding:.4rem .6rem;font-weight:900;font-size:.9rem;line-height:1.05}.pick3 button.on{background:var(--blue);color:#fff}.pick3.bad button.on{background:var(--red)}
.ptable{border-collapse:separate;border-spacing:.35rem;background:#fff;border-radius:1.2rem;padding:.5rem;box-shadow:0 .3rem 1rem rgba(18,38,58,.1);align-self:center}
.ptable th{font-weight:900;padding:.25rem .5rem;font-size:1rem;text-align:center;line-height:1.1}.ptable tr th:first-child{text-align:left;white-space:nowrap}.ptable th img{width:2rem;vertical-align:middle}
.cell{width:6.2rem;height:3.3rem;border-radius:.8rem;font-size:1.8rem;font-weight:900;background:#eef3f8;color:#9fb3c6}.cell.y{background:#d9f5e1;color:#1f7a3a}.cell.n{background:#fde3df;color:#a52c1c}.cell.bad{box-shadow:0 0 0 .25rem var(--red)}
/* station 3 */
.scene{width:100%;max-width:62rem;border-radius:1.2rem;align-self:center;display:block}
.slots{display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap;align-items:stretch}
.slot{width:10.5rem;min-height:6.5rem;border:.2rem dashed #9fb3c6;border-radius:1rem;background:rgba(255,255,255,.7);padding:.4rem;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.9rem;line-height:1.15;gap:.15rem}
.slot>b{position:absolute;top:-.6rem;left:-.4rem;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.9rem}
.slot.full{border-style:solid;border-color:var(--green);background:#e6f7eb}.slot img{width:2.4rem}
.cards{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.sc{background:#fff;border-radius:1rem;padding:.6rem .8rem;box-shadow:0 .25rem .6rem rgba(18,38,58,.15);display:flex;align-items:center;gap:.6rem;max-width:21rem;font-weight:800;text-align:left;line-height:1.2;border:.22rem solid transparent}
.sc img{width:3rem;flex:none}.sc.on{border-color:var(--blue);background:#eaf3fd}.sc.right{border-color:var(--green);background:#e6f7eb}.sc.wrong{border-color:var(--red);background:#fde3df}
/* station 4 */
.dens{display:flex;gap:1.2rem;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.dens canvas{width:15rem;border-radius:1.2rem;background:#45596c;flex:none}
.dside{flex:1;min-width:20rem;max-width:40rem;display:flex;flex-direction:column;gap:.7rem}
.objq{display:flex;align-items:center;gap:.6rem;background:#fff;border-radius:1rem;padding:.5rem .7rem;box-shadow:0 .2rem .5rem rgba(18,38,58,.1)}.objq img{width:3rem}.objq b{width:6rem;font-weight:900}
.objq .pick3{flex-wrap:wrap}
.mc{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}.mc button{background:#e8f1fa;border-radius:1rem;padding:.6rem 1.3rem;font-weight:900;font-size:1.35rem;box-shadow:0 .2rem 0 #c5d6e6}.mc button.no{opacity:.35;text-decoration:line-through}
/* station 5 */
.haz{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.hz{background:#fff;border-radius:1.1rem;padding:.7rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;box-shadow:0 .25rem .6rem rgba(18,38,58,.12);width:15rem}
.hz>img{width:4.5rem}.hz>b{font-weight:900;font-size:1.1rem;text-align:center}
.syms{display:flex;gap:.35rem}.syms button{width:4.2rem;height:4.2rem;border-radius:.8rem;background:#f2f6fa;display:grid;place-items:center;border:.22rem solid transparent}.syms svg{width:3.4rem}.syms button.on{border-color:var(--blue);background:#eaf3fd}.syms.bad button.on{border-color:var(--red)}
.loads{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;min-height:6rem}
.ld{background:#fff;border-radius:1rem;padding:.4rem .7rem;display:flex;flex-direction:column;align-items:center;box-shadow:0 .25rem .6rem rgba(18,38,58,.15);border:.22rem solid transparent;touch-action:none;cursor:grab;width:8rem;text-align:center;font-weight:900;font-size:.9rem;line-height:1.1}
.ld img{width:3.3rem}.ld.sel{border-color:var(--yel);box-shadow:0 0 0 .25rem var(--yel)}
.fleet{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.veh{width:19rem;background:linear-gradient(#cfe0ee,#9fb6c8);border-radius:1.2rem;padding:.5rem;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:.25rem solid transparent;position:relative;overflow:hidden}
.veh svg{width:100%}.veh b{font-weight:900;font-size:1.1rem}.veh .cargo{display:flex;gap:.2rem;min-height:2.6rem;position:absolute;top:.6rem;left:1rem}.veh .cargo img{width:2.4rem}
.veh.hot{border-color:#fff}.veh.go{animation:drive 1.4s ease-in forwards}@keyframes drive{to{transform:translateX(120vw)}}
.ghost{position:fixed;z-index:90;pointer-events:none;transform:scale(1.08) rotate(-4deg);opacity:.95}
/* explain */
.explain{max-width:58rem;width:100%;background:#fff8d6;border:.25rem solid #f2b400;border-radius:1.4rem;padding:1.2rem 1.5rem;display:flex;flex-direction:column;gap:.8rem;align-items:center;text-align:center}
.explain h3{font-weight:900;color:#a36b00}.explain .q{font-size:1.35rem;font-weight:900}
.sent{font-size:1.6rem;font-weight:800;line-height:1.9}
.blank{display:inline-block;min-width:8rem;border-bottom:.22rem solid var(--navy);padding:0 .4rem;margin:0 .2rem;color:var(--blue);font-weight:900;line-height:1.3}.blank.cur{background:#fff;border-radius:.5rem .5rem 0 0;box-shadow:0 0 0 .15rem var(--yel)}.blank.ok{color:var(--green)}
.bank{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}.bank button{background:#fff;border-radius:999px;padding:.5rem 1.1rem;font-weight:900;font-size:1.15rem;box-shadow:0 .2rem 0 #e0c46a;border:.15rem solid #f2b400;line-height:1.1}.bank button.used{opacity:.3}
/* artefact */
.art{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center}
.art .glow{width:12rem;height:12rem;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#fff8c4,#ffd23f 60%,#f2b400);box-shadow:0 0 3rem #ffd23f;animation:pop .7s}.art .glow img{width:8rem;animation:bob 1.6s ease-in-out infinite}
.art h3{font-size:1.9rem;font-weight:900}.art p{font-weight:700;font-size:1.15rem}
/* build */
.machine{position:relative;width:100%;max-width:60rem;height:25rem;align-self:center;border-radius:1.4rem;background:linear-gradient(#d5dde4,#9aa7b2);border:.35rem solid #6e7c88;box-shadow:inset 0 0 0 .5rem rgba(255,255,255,.35)}
.machine::before{content:"";position:absolute;inset:.8rem;border-radius:1rem;background:radial-gradient(circle,#7d8a96 .12rem,transparent .14rem) 0 0/1.6rem 1.6rem;opacity:.5}
.mtitle{position:absolute;left:50%;top:.5rem;transform:translateX(-50%);background:var(--navy);color:var(--yel);font-weight:900;padding:.25rem 1.1rem;border-radius:999px;white-space:nowrap;display:flex;align-items:center;gap:.4rem;z-index:2}.mtitle img{width:1.6rem}
.machine.on .mtitle img{animation:spin 1.5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.mslot{position:absolute;width:12rem;height:8.6rem;border:.22rem dashed #4b5966;border-radius:1rem;background:rgba(255,255,255,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.3rem;cursor:pointer;line-height:1.15;z-index:2}
.mslot small{font-weight:900;color:#5c6e80}.mslot span{font-size:.82rem;font-weight:700}.mslot img{width:3rem}.mslot b{font-weight:900;font-size:.95rem}
.mslot.full{border-style:solid;border-color:var(--green);background:#e6f7eb}.machine.on .mslot.full{box-shadow:0 0 1rem #9ff0a5}
.s0{left:calc(50% - 6rem);top:2.8rem}.s1{left:1rem;top:5rem}.s2{right:1rem;top:5rem}.s3{left:calc(50% - 6rem);top:12.6rem}.s4{right:1rem;bottom:1rem}
.mbelt{position:absolute;left:1rem;bottom:1rem;width:26rem;height:1.8rem;border-radius:999px;background:repeating-linear-gradient(90deg,#2b3035 0 1.2rem,#4b535b 1.2rem 2.4rem)}.machine.on .mbelt{animation:belt .5s linear infinite}
.hopper{position:absolute;left:5rem;top:14.8rem;z-index:3;display:flex;flex-direction:column;align-items:center}.hopper img{width:5rem;filter:drop-shadow(0 .4rem .3rem rgba(0,0,0,.35));animation:pop .4s}.hopper span{background:#fff;border-radius:.6rem;padding:.1rem .6rem;font-weight:900}
.inv{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.ai{background:#fff;border-radius:1rem;padding:.5rem .8rem;display:flex;flex-direction:column;align-items:center;font-weight:900;box-shadow:0 .25rem .6rem rgba(18,38,58,.15);border:.22rem solid transparent;touch-action:none;width:9rem;text-align:center;line-height:1.1}.ai img{width:3.6rem}.ai.sel{border-color:var(--yel);box-shadow:0 0 0 .25rem var(--yel)}
.gates{display:flex;gap:1rem;justify-content:center}.gate{background:linear-gradient(var(--b1),var(--b2));color:#fff;border-radius:1rem;padding:.5rem 1.4rem;font-weight:900;font-size:1.3rem;min-width:10rem;display:flex;flex-direction:column;align-items:center;box-shadow:0 .25rem 0 rgba(0,0,0,.25)}.gate img{width:2.6rem}
/* host */
.host{display:grid;grid-template-columns:1fr 24rem;gap:.9rem;flex:1;min-height:0}
.hmap{border-radius:1.3rem;width:100%;height:100%;min-height:0}
.hside{display:flex;flex-direction:column;gap:.6rem;min-height:0}
.room{background:var(--navy);color:#fff;border-radius:1.2rem;padding:.8rem;text-align:center}.room small{font-weight:800;opacity:.7}.room b{display:block;font-size:3.6rem;letter-spacing:.25em;color:var(--yel);line-height:1.1}.room p{font-weight:700;font-size:.85rem;opacity:.85;word-break:break-all}
.lb{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.45rem}
.lbr{display:grid;grid-template-columns:2rem 2.6rem 1fr auto;align-items:center;gap:.45rem;background:#fff;border-radius:1rem;padding:.4rem .6rem;border-left:.55rem solid var(--c)}
.lbr .rk{font-weight:900;font-size:1.3rem;text-align:center}.lbr>img{width:2.5rem}.lbr b{font-weight:900;display:block}.lbr .arts{display:flex;gap:.1rem}.lbr .arts img{width:1.4rem;filter:grayscale(1);opacity:.25}.lbr .arts img.got{filter:none;opacity:1}.lbr .tm{font-weight:900;font-size:1.25rem;font-variant-numeric:tabular-nums}
.lbr.fin{background:#fff8d6}
.podium{display:flex;align-items:flex-end;gap:1rem;justify-content:center}
.pd{display:flex;flex-direction:column;align-items:center;width:13rem}.pd img{width:4.5rem}.pd .who{background:var(--c);color:#fff;font-weight:900;font-size:1.3rem;padding:.4rem .9rem;border-radius:1rem;text-align:center;margin:.3rem 0}.pd .who small{display:block}
.pd .blk{width:100%;color:var(--navy);font-weight:900;font-size:3rem;display:grid;place-items:center;border-radius:1rem 1rem 0 0}
.pd.p1 .blk{height:12rem;background:linear-gradient(#ffd23f,#e3a800)}.pd.p2 .blk{height:8.5rem;background:linear-gradient(#e3e8ec,#aab4bd)}.pd.p3 .blk{height:6rem;background:linear-gradient(#e7b27c,#b97a3e)}
.conf{position:fixed;top:-3rem;width:2.2rem;animation:fall 2.2s ease-in forwards;pointer-events:none;z-index:95}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:.2}}
@media (max-width:900px){.host{grid-template-columns:1fr}.lt2{grid-template-columns:1fr}}

<body>
<header id="hd"><div class="brand"><img src="race-img/flag.webp" alt="">WASTE <em>SORTING</em> RACE</div><div id="hdMid"></div><button class="hbtn" id="viBtn">Tiếng Việt</button></header>
<main id="app"></main>
<div id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const IMG=k=>'race-img/'+k+'.webp',im=(k,c)=>'<img src="'+IMG(k)+'" alt=""'+(c?' class="'+c+'"':'')+'>';
let VI=false;try{VI=localStorage.getItem('race-vi')==='1'}catch(_){}
const bi=(en,vi)=>en+(VI&&vi?'<span class="vi">'+vi+'</span>':'');
const T=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(_){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const pre={};function loadImg(k){if(!pre[k]){pre[k]=new Image();pre[k].src=IMG(k)}return pre[k]}
/* ---------- data ---------- */
const STATE={solid:['SOLID','chất rắn','brick'],liquid:['LIQUID','chất lỏng','drop'],gas:['GAS','chất khí','cloud']};
const ITEMS=[['cardboard','bìa các-tông','box','solid'],['clothing','quần áo','shirt','solid'],['copper scrap','đồng phế liệu','bolt','solid'],['glass bottles','chai thủy tinh','bottle','solid'],['plastic containers','hộp nhựa','lotion','solid'],['scrap wood','gỗ vụn','wood','solid'],['food scraps','thức ăn thừa','banana','solid'],['tin cans','vỏ lon','can','solid'],['old batteries','pin cũ','battery','solid'],['newspaper','giấy báo','news','solid'],
 ['sand','cát','beach','solid','Sand can be poured, but every grain is a tiny solid that keeps its shape.','Cát đổ được, nhưng mỗi hạt cát là một chất rắn nhỏ giữ nguyên hình dạng.'],
 ['sponge','bọt biển','sponge','solid','A sponge squashes because it has air holes, but the sponge itself is a solid.','Bọt biển nén được vì có lỗ khí, nhưng bản thân bọt biển là chất rắn.'],
 ['cooking oil','dầu ăn','olive','liquid'],['milk','sữa','milk','liquid'],['paint','sơn','bucket','liquid'],['petrol','xăng','fuel','liquid'],['fruit juice','nước ép','juice','liquid'],
 ['honey','mật ong','honey','liquid','Honey flows very slowly, but it still flows. It is a liquid.','Mật ong chảy rất chậm nhưng vẫn chảy. Nó là chất lỏng.'],
 ['carbon dioxide','khí cacbonic','dash','gas'],['heated air','không khí nóng','hot','gas'],['steam','hơi nước','fog','gas'],
 ['methane from cows','khí mêtan từ bò','cow','gas','Cows burp methane. It is a gas that spreads into the air.','Bò ợ ra khí mêtan. Nó là chất khí lan vào không khí.'],
 ['helium in a balloon','khí heli trong bóng bay','balloon','gas','The helium inside the balloon is a gas.','Khí heli bên trong quả bóng là chất khí.']];
const ART=[{k:'gear',en:'Sorting Gear',vi:'Bánh răng phân loại'},{k:'ext',en:'Gas Compressor',vi:'Máy nén khí'},{k:'drum',en:'Leak-proof Tank',vi:'Bể chống rò rỉ'},{k:'scale',en:'Density Scale',vi:'Cân khối lượng riêng'},{k:'truck',en:'Delivery Truck',vi:'Xe chở hàng'}];
const ST=[
 {name:['Recycling Plant','Nhà máy tái chế'],hero:'factory',clue:['Waste is coming down the conveyor belt! Drag each item into the right bin before it falls off the end. Sort 12 items correctly.','Rác đang chạy trên băng chuyền! Kéo mỗi vật vào đúng thùng trước khi nó rơi khỏi băng chuyền. Phân loại đúng 12 vật.'],look:['Look closely at each item. Some are tricky!','Quan sát kỹ từng vật. Có vài vật rất khó!'],think:['Does it keep its shape? Can it flow? Does it spread out?','Nó có giữ hình dạng không? Có chảy không? Có lan ra không?']},
 {name:['Particle Lab','Phòng thí nghiệm hạt'],hero:'bubbles',clue:['Three sealed jars hold a solid, a liquid and a gas. Watch the particles and name each one. Then complete the properties table.','Ba lọ kín chứa một chất rắn, một chất lỏng và một chất khí. Quan sát các hạt và gọi tên. Sau đó hoàn thành bảng tính chất.'],look:['Watch how the particles move.','Quan sát cách các hạt chuyển động.'],think:['Are the particles touching? Can they move past each other?','Các hạt có chạm nhau không? Có trượt qua nhau được không?']},
 {name:['Landfill Rescue','Giải cứu bãi rác'],hero:'rain',clue:['A soluble fertiliser was dumped at a landfill site. Put the events in order, then choose the TWO best ways to stop the pollution.','Phân bón tan được bị đổ ở bãi rác. Sắp xếp các sự việc theo thứ tự, rồi chọn HAI cách tốt nhất để ngăn ô nhiễm.'],look:['Look at the landfill, the ground and the river.','Quan sát bãi rác, mặt đất và dòng sông.'],think:['Where does rainwater go after it falls?','Nước mưa đi đâu sau khi rơi xuống?']},
 {name:['Density Tower','Tháp khối lượng riêng'],hero:'honey',clue:['Build a density tower! Put the three liquids in order. Predict where each object will stop. Then solve the problem.','Xây tháp khối lượng riêng! Sắp xếp ba chất lỏng. Dự đoán mỗi vật sẽ dừng ở đâu. Sau đó giải bài toán.'],look:['Look at the liquids and the objects.','Quan sát các chất lỏng và các vật.'],think:['Less dense things float on top. Denser things sink.','Vật có khối lượng riêng nhỏ hơn nổi lên trên. Vật lớn hơn chìm xuống.']},
 {name:['Hazard Highway','Xa lộ nguy hiểm'],hero:'truck',clue:['Label each dangerous substance with the right hazard symbol. Then load every waste onto the right vehicle and dispatch the trucks.','Dán đúng biểu tượng nguy hiểm cho mỗi chất. Sau đó xếp rác lên đúng xe và cho xe chạy.'],look:['Look at the symbols and the vehicles.','Quan sát các biểu tượng và các xe.'],think:['How must solids, liquids and gases be moved safely?','Chất rắn, lỏng và khí phải được chở an toàn thế nào?']},
 {name:['Pit Stop: Recycling Machine','Trạm dừng: Máy tái chế'],hero:'recycle',clue:['Use your 5 artefacts to build the Recycling Machine. Put each part where it does the right job. Then switch it on and sort the last load!','Dùng 5 cổ vật để lắp máy tái chế. Đặt mỗi bộ phận vào đúng chỗ làm đúng nhiệm vụ. Sau đó bật máy và phân loại mẻ rác cuối!'],look:['Read the job of each part of the machine.','Đọc nhiệm vụ của từng bộ phận máy.'],think:['Which artefact can do that job?','Cổ vật nào làm được nhiệm vụ đó?']}];
const MASC=['rocket','volcano','wave','diamond','fire','bulb','star','seed'],MCOL=['#e5432d','#d9531e','#2f86d6','#139c9c','#e39b00','#8e44ad','#c79a00','#2e9e4f'];
/* ---------- message bus (ntfy.sh + same-device channel) ---------- */
const BUS={topic:null,es:null,bc:null,seen:new Set(),on:null,state:'off'};
function busOpen(code,onMsg){busClose();BUS.on=onMsg;BUS.topic='scilab-wsr-'+code.toLowerCase();
 try{BUS.bc=new BroadcastChannel(BUS.topic);BUS.bc.onmessage=e=>busIn(e.data)}catch(_){}
 try{BUS.es=new EventSource('https://ntfy.sh/'+BUS.topic+'/sse?since=3h');BUS.es.onopen=()=>{BUS.state='on';hdr()};BUS.es.onerror=()=>{BUS.state='off';hdr()};BUS.es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event&&d.event!=='message')return;busIn(JSON.parse(d.message))}catch(_){}}}catch(_){}}
function busClose(){try{BUS.es&&BUS.es.close()}catch(_){}try{BUS.bc&&BUS.bc.close()}catch(_){}BUS.es=BUS.bc=null;BUS.state='off'}
function busIn(o){if(!o||!o.mid||BUS.seen.has(o.mid))return;BUS.seen.add(o.mid);BUS.on&&BUS.on(o)}
function busSend(o){if(!BUS.topic)return;o.mid=Math.random().toString(36).slice(2)+Date.now().toString(36);BUS.seen.add(o.mid);
 try{BUS.bc&&BUS.bc.postMessage(o)}catch(_){}
 fetch('https://ntfy.sh/'+BUS.topic,{method:'POST',body:JSON.stringify(o)}).catch(()=>{})}
/* ---------- app state ---------- */
let MODE='home',TS=store.get('wsr-team'),HS=store.get('wsr-host'),CH=null,EXP=null,SEL=null,DRAG=null,LOOP=null;
function saveT(){store.set('wsr-team',TS)}function saveH(){store.set('wsr-host',HS)}
function toast(msg,kind){const t=$('#toast');t.innerHTML=msg;t.className='on '+(kind||'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2600)}
function confetti(n){for(let i=0;i<(n||26);i++){const s=document.createElement('img');s.src=IMG(['star','party','recycle','medal'][i%4]);s.className='conf';s.style.left=(Math.random()*95)+'vw';s.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2900)}}
function teamTime(){if(!TS||!TS.startAt)return 0;const end=TS.finishAt||Date.now();return (end-TS.startAt)/1000+TS.pen}
function penalty(sec,why,el){TS.pen+=sec;saveT();toast('⏱ +'+sec+' s · '+why,'bad');if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}hdr()}
function hdr(){
 const m=$('#hdMid');$('#viBtn').classList.toggle('on',VI);
 const net='<span class="net '+(BUS.state==='on'?'on':'off')+'">'+(BUS.state==='on'?'● LIVE':'● '+(VI?'ngoại tuyến':'offline'))+'</span>';
 if(MODE==='host'&&HS){m.innerHTML='<span class="chip" style="--c:#2b3e52">📺 '+(VI?'Điều khiển':'Race control')+' · '+HS.room+'</span><span class="clock" id="clk">'+T(HS.startAt?(Date.now()-HS.startAt)/1000:0)+'</span>'+net;return}
 if(MODE==='team'&&TS){m.innerHTML='<span class="chip" style="--c:'+TS.col+'">'+im(TS.ic)+TS.name+'</span><div class="prog">'+ART.map((a,i)=>'<i class="'+(TS.arts.includes(i)?'got':'')+(TS.st===i&&!TS.finishAt?' now':'')+'">'+im(a.k)+'</i>').join('')+'</div><span class="clock" id="clk">'+T(teamTime())+'</span>'+(TS.room!=='SOLO'?net:'');return}
 m.innerHTML='';
}
setInterval(()=>{const c=$('#clk');if(!c)return;if(MODE==='host'&&HS)c.textContent=T(HS.startAt?(Date.now()-HS.startAt)/1000:0);if(MODE==='team'&&TS)c.textContent=T(teamTime());
 if(MODE==='team'&&TS&&TS.phase==='play'){const el=(Date.now()-TS.stStart)/1000,s=$('#stt');if(s){s.textContent=T(el)+' / 7:00';s.classList.toggle('over',el>420)}if(el>420&&!TS.tu){TS.tu=true;penalty(60,VI?'Hết 7 phút! Tiếp tục nào.':'7 minutes are up! Keep going.')}}
 if(MODE==='host')hostTick();},500);
$('#viBtn').onclick=()=>{VI=!VI;try{localStorage.setItem('race-vi',VI?'1':'0')}catch(_){}render()};
/* ---------- render router ---------- */
function stopLoop(){if(LOOP){cancelAnimationFrame(LOOP);LOOP=null}}
function render(){stopLoop();hdr();const A=$('#app');A.className='';
 if(MODE==='home')return vHome(A);
 if(MODE==='join')return vJoin(A);
 if(MODE==='host')return vHost(A);
 if(MODE==='team'){const p=TS.phase;if(p==='lobby')return vLobby(A);if(p==='route')return vRoute(A);if(p==='play')return vPlay(A);if(p==='explain')return vExplain(A);if(p==='art')return vArt(A);if(p==='finish')return vFinish(A)}}
function vHome(A){A.className='center';
 A.innerHTML='<div class="banner">'+im('flag')+' WASTE <em>SORTING</em> RACE! '+im('flag')+'</div><p class="title" style="font-size:1.3rem;max-width:52rem">'+bi('Race against the other teams! Finish each station to win an artefact. Collect all 5 artefacts, then build the Recycling Machine at the Pit Stop.','Thi đua với các nhóm khác! Hoàn thành mỗi trạm để nhận một cổ vật. Thu đủ 5 cổ vật rồi lắp máy tái chế ở Trạm dừng.')+'</p>'+
 '<div class="ltce"><span class="l on">LOOK</span><i>➜</i><span class="t on">THINK</span><i>➜</i><span class="c on">CHOOSE</span><i>➜</i><span class="e on">EXPLAIN</span></div>'+
 '<div class="roles"><button class="role" id="goJoin">'+im('rocket')+'<b>'+bi('Join as a team','Tham gia theo nhóm')+'</b><p>'+bi('Use this on each team tablet.','Dùng trên máy tính bảng của mỗi nhóm.')+'</p></button><button class="role" id="goHost">'+im('trophy')+'<b>'+bi('Race control','Điều khiển cuộc đua')+'</b><p>'+bi('Teacher: open this on the classroom TV.','Giáo viên: mở trên màn hình TV của lớp.')+'</p></button></div>'+
 (TS&&TS.phase&&TS.phase!=='finish'?'<button class="btn" id="resume">↩ '+bi('Continue as '+TS.name,'Tiếp tục với '+TS.name)+'</button>':'');
 $('#goJoin').onclick=()=>{MODE='join';render()};$('#goHost').onclick=()=>hostOpen();
 const r=$('#resume');if(r)r.onclick=()=>{MODE='team';teamConnect();render()}}
/* ---------- team: join + lobby ---------- */
let JN={code:'',name:'',ic:0};
function vJoin(A){A.className='center';
 A.innerHTML='<div class="card" style="max-width:44rem;width:100%;display:flex;flex-direction:column;gap:.9rem"><div class="title">'+im('rocket','')+'</div><label class="field">'+bi('Room code (on the TV)','Mã phòng (trên màn hình TV)')+'<input id="jCode" class="code" maxlength="4" autocomplete="off" value="'+JN.code+'"></label><label class="field">'+bi('Team name','Tên nhóm')+'<input id="jName" maxlength="16" autocomplete="off" value="'+JN.name+'" placeholder="Eco Heroes"></label><div class="field">'+bi('Choose your team mascot','Chọn linh vật của nhóm')+'<div class="mascots">'+MASC.map((k,i)=>'<button data-m="'+i+'" style="--c:'+MCOL[i]+'" class="'+(JN.ic===i?'on':'')+'">'+im(k)+'</button>').join('')+'</div></div><div class="err" id="jErr"></div><div class="foot"><button class="btn" id="jBack">← '+bi('Back','Quay lại')+'</button><button class="btn" id="jSolo">'+bi('Practice alone','Luyện tập một mình')+'</button><button class="btn go big" id="jGo">'+bi('Join the race','Tham gia')+' ➜</button></div></div>';
 $$('.mascots button').forEach(b=>b.onclick=()=>{JN.ic=+b.dataset.m;$$('.mascots button').forEach(x=>x.classList.toggle('on',x===b))});
 const rd=()=>{JN.code=$('#jCode').value.trim().toUpperCase();JN.name=$('#jName').value.trim()};
 $('#jBack').onclick=()=>{rd();MODE='home';render()};
 const go=solo=>{rd();if(!JN.name){$('#jErr').textContent=VI?'Hãy nhập tên nhóm.':'Type your team name.';return}if(!solo&&!/^[A-Z0-9]{4}$/.test(JN.code)){$('#jErr').textContent=VI?'Mã phòng có 4 ký tự.':'The room code has 4 letters.';return}
  TS={room:solo?'SOLO':JN.code,id:Math.random().toString(36).slice(2,9),name:JN.name.slice(0,16),ic:MASC[JN.ic],col:MCOL[JN.ic],phase:'lobby',st:0,arts:[],pen:0,startAt:null,finishAt:null,stStart:0,tu:false};
  if(solo){TS.startAt=Date.now();TS.phase='route'}saveT();MODE='team';teamConnect();if(!solo)busSend({t:'join',id:TS.id,name:TS.name,ic:TS.ic,col:TS.col});render()};
 $('#jGo').onclick=()=>go(false);$('#jSolo').onclick=()=>go(true)}
function teamConnect(){if(!TS||TS.room==='SOLO'){busClose();return}busOpen(TS.room,o=>{
 if(o.t==='start'&&!TS.startAt){TS.startAt=Date.now();if(TS.phase==='lobby')TS.phase='route';saveT();busSend({t:'join',id:TS.id,name:TS.name,ic:TS.ic,col:TS.col});render();toast(VI?'Bắt đầu! 🏁':'The race has started! 🏁','ok')}
 if(o.t==='hello'&&TS.startAt===null)busSend({t:'join',id:TS.id,name:TS.name,ic:TS.ic,col:TS.col});
 if(o.t==='ping')teamReport()})}
function teamReport(){if(!TS||TS.room==='SOLO')return;busSend({t:'prog',id:TS.id,name:TS.name,ic:TS.ic,col:TS.col,st:TS.st,arts:TS.arts,el:Math.round(teamTime()),fin:!!TS.finishAt})}
function vLobby(A){A.className='center lobby';
 A.innerHTML='<div class="card" style="text-align:center;display:flex;flex-direction:column;gap:.8rem;align-items:center;max-width:44rem">'+im(TS.ic,'spin')+'<div class="title">'+bi('Ready, '+TS.name+'!','Sẵn sàng, '+TS.name+'!')+'</div><p style="font-weight:800;font-size:1.25rem">'+bi('Wait for your teacher to start the race on the TV.','Hãy chờ giáo viên bắt đầu cuộc đua trên TV.')+'</p><p style="font-weight:700;color:#5c6e80">'+bi('Room','Phòng')+' <b>'+TS.room+'</b></p><button class="btn" id="lvBack">'+bi('Leave','Rời đi')+'</button></div>';
 $('#lvBack').onclick=()=>{busClose();TS=null;saveT();MODE='home';render()}}
/* ---------- team: route & clue ---------- */
function routeMap(){return '<div class="routemap">'+ST.map((s,i)=>(i?'<div class="road"></div>':'')+'<div class="node '+(TS.arts.includes(i)||(i===5&&TS.finishAt)?'done':i===TS.st?'next':'')+'"><div class="o">'+im(i<5?ART[i].k:'flag')+'</div>'+(i<5?(i+1)+'. ':'')+bi(s.name[0],s.name[1])+'</div>').join('')+'</div>'}
function vRoute(A){const s=ST[TS.st],i=TS.st;A.className='center';
 A.innerHTML=routeMap()+'<div class="card clue"><div class="ri">'+(i<5?'ROUTE INFO':'PIT STOP')+'<small>'+(i<5?bi('Station '+(i+1)+' of 5','Trạm '+(i+1)+'/5'):bi('Final challenge','Thử thách cuối'))+'</small></div>'+im(s.hero,'hero')+'<h3>'+bi(s.clue[0],s.clue[1])+'</h3><div class="lt2"><div><b>👀 LOOK</b>'+bi(s.look[0],s.look[1])+'</div><div><b>🤔 THINK</b>'+bi(s.think[0],s.think[1])+'</div></div>'+(i<5?'<div class="prize">'+bi('Artefact to win:','Cổ vật:')+' '+im(ART[i].k)+'<b>'+bi(ART[i].en,ART[i].vi)+'</b></div>':'')+'<button class="btn go big" id="goSt">⏱ '+bi('Go!','Bắt đầu!')+'</button></div>';
 $('#goSt').onclick=()=>{TS.phase='play';TS.stStart=Date.now();TS.tu=false;CH=null;saveT();render()}}
function stHead(i,part){return '<div class="sthead"><div class="nm"><small>'+(i<5?bi('STATION '+(i+1),'TRẠM '+(i+1)):'PIT STOP')+(part?' · '+part:'')+'</small><b>'+bi(ST[i].name[0],ST[i].name[1])+'</b></div><div class="ltce"><span class="l">LOOK</span><i>➜</i><span class="t">THINK</span><i>➜</i><span class="c on now">CHOOSE</span><i>➜</i><span class="e">EXPLAIN</span></div><span class="stt" id="stt">0:00 / 7:00</span></div>'}

 L.forEach(([id,t],i)=>{const n=t.fin?6:Math.min(6,t.arts.length),pos=P[n],a=i/Math.max(1,L.length)*Math.PI*2,ox=Math.cos(a)*38,oy=Math.sin(a)*26;svg+='<circle cx="'+(pos[0]+ox)+'" cy="'+(pos[1]+oy)+'" r="23" fill="'+t.col+'" stroke="#fff" stroke-width="4"/><image href="'+IMG(t.ic)+'" x="'+(pos[0]+ox-16)+'" y="'+(pos[1]+oy-16)+'" width="32" height="32"/>'});
