<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Length Legends: Kingdom Conquest</title>
<style>
:root{--brown:#5a1d0e;--brown2:#7a2c14;--cream:#fbe9c4;--ink:#2b1a0e;--navy:#12306f;--yel:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(11px,1.06vw,24px)}html,body{height:100%}
body{font-family:"Nunito","Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:#0b1020;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}button:disabled{opacity:.4;cursor:default}
img{-webkit-user-drag:none;pointer-events:none}
.vi{display:none;font-weight:600;opacity:.8;font-size:.78em}
body.vi-on .vi{display:block}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.title-font{font-family:"Impact","Haettenschweiler","Arial Black",system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
/* top-right tools */
#tools{position:fixed;top:.6rem;right:.7rem;display:flex;gap:.4rem;z-index:60}
#tools button{background:rgba(0,0,0,.45);color:#fff;font-weight:800;border-radius:999px;padding:.45rem .85rem;font-size:.95rem;border:.12rem solid rgba(255,255,255,.25)}
#tools button.on{background:#fff;color:#111}
/* starry */
.stars{background:radial-gradient(ellipse at 50% 40%,#1b2b5a 0%,#0b1020 55%,#05070f 100%)}
.stars::before{content:"";position:absolute;inset:0;background-image:var(--st);opacity:.9}
.glow{position:absolute;width:40rem;height:40rem;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(110,160,255,.35),rgba(110,160,255,0) 65%)}
#title{align-items:center;justify-content:center;gap:1.2rem;color:#fff;text-align:center}
#title h1{font-size:6.5rem;line-height:.9;color:#fff;text-shadow:0 .3rem 0 #000,0 0 2rem rgba(120,170,255,.6);position:relative}
#title h1 small{display:block;font-size:2.1rem;letter-spacing:.3em;background:#fff;color:#0b1020;padding:.1rem 1rem;margin:.8rem auto 0;width:max-content;text-shadow:none}
.emb{display:flex;gap:2.5rem;justify-content:center;position:relative}
.emb div{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:1.05rem}
.emb img{width:7rem;filter:drop-shadow(0 0 1.2rem var(--c))}
.bigbtn{position:relative;background:linear-gradient(#ffe066,#f2b400);color:#2b1a0e;font-weight:900;font-size:1.6rem;padding:.8rem 2.6rem;border-radius:999px;box-shadow:0 .35rem 0 #a87600,0 0 2rem rgba(255,210,63,.4)}
.bigbtn:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 #a87600}
.ghost{position:relative;color:#fff;font-weight:800;border:.15rem solid rgba(255,255,255,.6);border-radius:999px;padding:.6rem 1.6rem;font-size:1.15rem}
.credit{position:absolute;bottom:.6rem;font-size:.75rem;opacity:.55}
/* rules */
#rules{align-items:center;justify-content:center;color:#fff;text-align:center;gap:1.5rem}
#ruleTxt{position:relative;font-size:2.9rem;font-weight:900;max-width:70rem;line-height:1.15;text-shadow:0 .2rem .6rem #000}
#ruleTxt em{font-style:normal;color:#ffd23f}#ruleTxt b{color:#8fd3ff}
#ruleArt{position:relative;height:22rem;width:70rem;display:flex;align-items:center;justify-content:center;gap:2rem}
.rnav{position:relative;display:flex;gap:1rem;align-items:center}
.dots{display:flex;gap:.4rem}.dots i{width:.7rem;height:.7rem;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{background:#ffd23f}
/* parchment */
.parch{background:radial-gradient(ellipse at center,#f6e7c6 0%,#ecd3a0 60%,#c9a46a 100%);position:relative}
.parch::before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='4' seed='3'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .55 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");opacity:.35;pointer-events:none}
.parch::after{content:"";position:absolute;inset:1rem;border:.25rem solid rgba(90,29,14,.55);border-radius:1rem;pointer-events:none;box-shadow:inset 0 0 0 .4rem rgba(90,29,14,.12)}
.scroll{position:relative;z-index:2;background:linear-gradient(#6b2512,var(--brown));color:var(--cream);border-radius:0 0 1.6rem 1.6rem;padding:.8rem 2.5rem 1rem;box-shadow:0 .5rem 1rem rgba(0,0,0,.35);text-align:center}
/* setup */
#setup{align-items:center;justify-content:center;gap:1rem}
#setup h2{position:relative;z-index:2;font-size:3rem;color:var(--brown);margin-top:1.5rem}
.ngrid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;width:88rem;max-width:94vw}
.ncard{background:rgba(255,250,236,.85);border-radius:1.2rem;border:.3rem solid var(--c);padding:.8rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.ncard img{width:5.5rem}.ncard b{font-size:1.35rem;font-weight:900;color:var(--c)}
.ncard input{font:inherit;font-weight:800;font-size:1.1rem;width:100%;border-radius:.7rem;border:.15rem solid #d9c49a;padding:.35rem .6rem;background:#fff}
.ncard small{font-weight:800;color:#7a5a36}
.opts{position:relative;z-index:2;display:flex;gap:1rem;align-items:center;font-weight:800;color:var(--brown)}
.opts select{font:inherit;font-weight:800;border-radius:.6rem;padding:.3rem .6rem;border:.15rem solid #b08850;background:#fff8e6}
/* map screen */
#map{flex-direction:row;background:#0d2c4f}
#mapW{flex:1;min-width:0;position:relative}
#mapSvg{width:100%;height:100%;display:block}
.land{cursor:pointer;transition:fill .5s}
.land.tgt{stroke:#ffd23f;stroke-width:5;animation:pulse 1s infinite}
@keyframes pulse{50%{stroke-width:9;stroke:#fff}}
.land.dim{fill:#000;fill-opacity:.28}
.lbl{pointer-events:none}
#side{width:25rem;flex:none;background:linear-gradient(#1a2236,#0d1424);color:#fff;display:flex;flex-direction:column;gap:.6rem;padding:3.4rem .8rem .8rem}
#side h3{font-size:1.5rem;line-height:1}#side h3 small{display:block;font-size:.8rem;letter-spacing:.2em;color:#ffd23f}
.nrow{display:grid;grid-template-columns:3.2rem 1fr auto;gap:.5rem;align-items:center;background:rgba(255,255,255,.06);border-radius:.9rem;padding:.4rem .6rem;border-left:.45rem solid var(--c)}
.nrow img{width:3rem}.nrow b{font-weight:900;font-size:1.05rem;display:block;color:var(--c2)}.nrow small{opacity:.75;font-size:.78rem;font-weight:700;display:block;line-height:1.15}
.nrow .cnt{font-weight:900;font-size:1.8rem;text-align:right;line-height:1}.nrow .cnt small{font-size:.65rem;opacity:.7}
.nrow.att{box-shadow:0 0 0 .2rem #ffd23f}.nrow.safe{box-shadow:0 0 0 .2rem #8fd3ff}
.tag{display:inline-block;font-size:.7rem;font-weight:900;border-radius:999px;padding:.05rem .45rem;margin-left:.3rem;vertical-align:middle}.tag.a{background:#ffd23f;color:#2b1a0e}.tag.s{background:#8fd3ff;color:#0b1020}
#msg{background:#fff8e6;color:var(--ink);border-radius:1rem;padding:.7rem .9rem;font-weight:800;font-size:1.05rem;line-height:1.25;min-height:5rem}
#msg b{color:var(--brown)}
.sbtn{background:linear-gradient(#ffe066,#f2b400);color:#2b1a0e;font-weight:900;font-size:1.3rem;padding:.8rem;border-radius:1rem;box-shadow:0 .25rem 0 #a87600}
.sbtn2{background:rgba(255,255,255,.1);color:#fff;font-weight:800;padding:.5rem;border-radius:.8rem;font-size:.95rem}
.srow{display:flex;gap:.4rem}.srow button{flex:1}
.round{font-weight:800;opacity:.75;text-align:center;font-size:.9rem}
/* letters */
#letters{align-items:center;justify-content:center;gap:1rem}
.brush{position:relative;z-index:2;font-size:3.3rem;color:#f3d29b;background:var(--brown);padding:.3rem 3rem;transform:rotate(-1.5deg);clip-path:polygon(2% 10%,98% 0,100% 85%,4% 100%)}
.lgrid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem 1.6rem}
.lgrid button{font-size:5.2rem;font-weight:900;color:var(--brown);width:7rem;height:6.6rem;line-height:1;border-radius:1rem;transition:transform .15s}
.lgrid button:hover:not(:disabled){transform:scale(1.12);background:rgba(90,29,14,.08)}
.lgrid button.used{color:rgba(90,29,14,.22);text-decoration:line-through;text-decoration-thickness:.3rem}
.back{position:absolute;left:1.8rem;bottom:1.6rem;z-index:3;background:var(--brown);color:var(--cream);font-weight:800;padding:.55rem 1.2rem;border-radius:999px}
/* question */
#question{align-items:stretch}
#qHead{margin:0 13rem 0 4rem;font-size:2.1rem;font-weight:800;line-height:1.2}
#qHead small{display:block;font-size:.95rem;opacity:.75;letter-spacing:.12em;font-weight:900}
#qBody{position:relative;z-index:2;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:.5rem 3rem}
#qBody svg{width:100%;height:100%;max-height:100%}
#qFoot{position:relative;z-index:2;margin:0 4rem;background:linear-gradient(var(--brown),#3e1206);color:var(--cream);border-radius:1.6rem 1.6rem 0 0;padding:.7rem 1.5rem;display:flex;align-items:center;gap:1rem;min-height:5.6rem}
#qAns{flex:1;font-size:2rem;font-weight:900;text-align:center}
#qAns.hide{font-size:1.3rem;opacity:.6;font-weight:800}
.qbtn{background:var(--cream);color:var(--brown);font-weight:900;font-size:1.15rem;padding:.6rem 1.2rem;border-radius:999px;white-space:nowrap}
.qbtn.y{background:#ffd23f;color:#2b1a0e}
#timer{width:4.6rem;height:4.6rem;flex:none;position:relative;cursor:pointer}
#timer svg{width:100%;height:100%;transform:rotate(-90deg)}#timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.4rem}
/* picker overlay */
#pick{position:absolute;inset:0;z-index:20;background:rgba(10,8,4,.72);display:none;align-items:center;justify-content:center}
#pick.on{display:flex}
.pbox{background:#fff8e6;border-radius:1.6rem;padding:1.4rem 1.8rem;width:min(80rem,94vw);display:flex;flex-direction:column;gap:1rem;align-items:center;border:.35rem solid var(--brown)}
.pbox h3{font-size:2rem;color:var(--brown);text-align:center;line-height:1.15}
.pbox h3 small{display:block;font-size:1.05rem;color:#7a5a36}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;width:100%}
.tgrid .col{display:flex;flex-direction:column;gap:.5rem;align-items:stretch;background:#fff;border-radius:1rem;padding:.6rem;border:.25rem solid var(--c)}
.tgrid .col>div{display:flex;align-items:center;gap:.4rem;font-weight:900;color:var(--c);justify-content:center}.tgrid .col>div img{width:2.4rem}
.tgrid button{background:var(--c);color:#fff;font-weight:900;font-size:1.2rem;padding:.6rem;border-radius:.8rem}
.tgrid button:disabled{opacity:.25}
.none{background:#ddd0b5;color:#4a3a2a;font-weight:900;padding:.6rem 1.6rem;border-radius:999px;font-size:1.1rem}
/* battle */
#battle{align-items:center;justify-content:center;color:#fff;gap:1rem}
.bwrap{position:relative;display:flex;align-items:center;gap:3rem}
.fighter{display:flex;flex-direction:column;align-items:center;gap:.6rem;width:24rem}
.fighter .em{width:13rem;filter:drop-shadow(0 0 2rem var(--c))}
.fighter b{font-size:2rem;color:var(--c2);text-shadow:0 .15rem 0 #000}
.fighter small{font-weight:800;opacity:.8;font-size:1.1rem}
.hand{width:9rem;height:9rem;transform-origin:50% 90%}
.hand.l{transform:rotate(90deg) scaleX(-1)}.hand.r{transform:rotate(-90deg)}
.shake .hand.l{animation:shL .5s ease-in-out infinite}.shake .hand.r{animation:shR .5s ease-in-out infinite}
@keyframes shL{50%{transform:rotate(60deg) scaleX(-1)}}@keyframes shR{50%{transform:rotate(-60deg)}}
.vs{font-size:6rem;color:#ffd23f;text-shadow:0 .3rem 0 #000;position:relative}
#bCall{position:relative;font-size:5rem;color:#fff;min-height:6.5rem;text-shadow:0 .3rem 0 #000}
#bTitle{position:relative;font-size:2.6rem;font-weight:900;text-align:center;line-height:1.15}#bTitle em{font-style:normal;color:#ffd23f}
.brow{position:relative;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.wbtn{background:var(--c);color:#fff;font-weight:900;font-size:1.4rem;padding:.8rem 1.8rem;border-radius:1rem;box-shadow:0 .3rem 0 rgba(0,0,0,.4);display:flex;align-items:center;gap:.5rem}.wbtn img{width:2.6rem}
/* end */
#end{align-items:center;justify-content:center;color:#fff;gap:1rem}
.pod{position:relative;display:flex;align-items:flex-end;gap:1.2rem}
.pd{width:15rem;display:flex;flex-direction:column;align-items:center}
.pd img{width:7rem;filter:drop-shadow(0 0 1.4rem var(--c))}.pd b{font-size:1.5rem;color:var(--c2);text-align:center}.pd small{font-weight:800}
.pd .blk{width:100%;border-radius:1rem 1rem 0 0;display:grid;place-items:center;font-size:3.5rem;font-weight:900;color:#2b1a0e;margin-top:.4rem}
#toast{position:fixed;left:50%;top:1rem;transform:translate(-50%,-180%);background:#fff8e6;color:var(--ink);font-weight:900;font-size:1.4rem;padding:.7rem 1.6rem;border-radius:1rem;z-index:90;transition:transform .3s;border:.25rem solid var(--brown);text-align:center;max-width:80vw}
#toast.on{transform:translate(-50%,0)}
.conf{position:fixed;top:-3rem;width:2.4rem;animation:fall 2.4s ease-in forwards;pointer-events:none;z-index:95}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
</style>
</head>
<body>
<div id="tools"><button id="viBtn">Tiếng Việt</button><button id="sndBtn" class="on">🔊</button><button id="fsBtn">⛶</button></div>

<section class="screen stars on" id="title"><div class="glow"></div>
 <h1 class="title-font">Length Legends<small>Kingdom Conquest</small></h1>
 <div class="emb" id="tEmb"></div>
 <div style="position:relative;font-weight:800;font-size:1.2rem;opacity:.85">Unit 7 · Length · m, cm and mm — Review game<span class="vi">Bài 7 · Độ dài · m, cm và mm — Trò chơi ôn tập</span></div>
 <div style="display:flex;gap:1rem;position:relative"><button class="bigbtn" id="goRules">▶ How to play<span class="vi">Cách chơi</span></button><button class="ghost" id="goResume" style="display:none">↩ Continue the game</button></div>
</section>

<section class="screen stars" id="rules"><div class="glow"></div>
 <div id="ruleArt"></div><div id="ruleTxt"></div>
 <div class="rnav"><button class="ghost" id="rPrev">◀</button><div class="dots" id="rDots"></div><button class="ghost" id="rNext">▶</button><button class="bigbtn" id="rSkip" style="font-size:1.1rem;padding:.6rem 1.6rem">Set up teams ➜</button></div>
</section>

<section class="screen parch" id="setup">
 <h2 class="title-font">Choose your teams</h2>
 <div class="ngrid" id="ngrid"></div>
 <div class="opts">⏱ Timer per question: <select id="tSel"><option value="0">No timer</option><option value="30">30 s</option><option value="60" selected>60 s</option><option value="90">90 s</option><option value="120">2 min</option></select></div>
 <div style="position:relative;z-index:2;display:flex;gap:1rem"><button class="back" style="position:static" id="sBack">◀ Rules</button><button class="bigbtn" id="sGo">⚔ Start the war!</button></div>
</section>

<section class="screen" id="map">
 <div id="mapW"><svg id="mapSvg"></svg></div>
 <aside id="side">
  <h3 class="title-font"><small>LENGTH LEGENDS</small>Kingdom Conquest</h3>
  <div id="nlist" style="display:flex;flex-direction:column;gap:.45rem"></div>
  <div id="msg"></div>
  <button class="sbtn" id="mLetter">🔤 Choose a letter<span class="vi">Chọn một chữ cái</span></button>
  <div class="srow"><button class="sbtn2" id="mUndo">↩ Undo</button><button class="sbtn2" id="mSkip">⏭ Skip attack</button></div>
  <div class="srow"><button class="sbtn2" id="mRules">📜 Rules</button><button class="sbtn2" id="mEnd">🏁 End game</button></div>
  <div class="round" id="round"></div>
 </aside>
</section>

<section class="screen parch" id="letters">
 <div class="brush title-font">Choose a letter</div>
 <div class="lgrid" id="lgrid"></div>
 <button class="back" id="lBack">◀ Map</button>
</section>

<section class="screen parch" id="question">
 <div class="scroll" id="qHead"></div>
 <div id="qBody"></div>
 <div id="qFoot"><div id="timer" title="Start / pause timer"></div><div id="qAns" class="hide"></div><button class="qbtn y" id="qShow">👁 Show answer</button><button class="qbtn" id="qDone" style="display:none">⚔ Who got it first?</button></div>
 <div id="pick"><div class="pbox"><h3 id="pTitle"></h3><div class="tgrid" id="pGrid"></div><button class="none" id="pNone"></button></div></div>
</section>

<section class="screen stars" id="battle"><div class="glow"></div>
 <div id="bTitle"></div>
 <div class="bwrap" id="bWrap"></div>
 <div id="bCall" class="title-font"></div>
 <div class="brow" id="bRow"></div>
</section>

<section class="screen stars" id="end"><div class="glow"></div>
 <h1 class="title-font" style="position:relative;font-size:4.5rem;color:#ffd23f;text-shadow:0 .3rem 0 #000">The war is over!</h1>
 <div class="pod" id="pod"></div>
 <div id="mvp" style="position:relative;font-weight:800;font-size:1.2rem;text-align:center"></div>
 <div style="position:relative;display:flex;gap:1rem"><button class="ghost" id="eMap">🗺 Back to the map</button><button class="bigbtn" id="eNew">🔄 New game</button></div>
</section>
<div id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const IMG=k=>'img/'+k+'.webp',im=(k,st,cl)=>'<img src="'+IMG(k)+'" alt=""'+(st?' style="'+st+'"':'')+(cl?' class="'+cl+'"':'')+'>';
let VI=false;const bi=(en,vi)=>en+'<span class="vi">'+vi+'</span>',L=(en,vi)=>VI?vi:en;
const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
function confetti(n,list){for(let i=0;i<(n||30);i++){const s=document.createElement('img');s.src=IMG((list||['2b50','1f389','1f451','1f6a9'])[i%(list||[1,2,3,4]).length]);s.className='conf';s.style.left=(Math.random()*96)+'vw';s.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
/* stars background */
{let sh=[];for(let i=0;i<160;i++){const x=Math.random()*100,y=Math.random()*100,r=Math.random()<.85?1:2;sh.push('radial-gradient('+r+'px '+r+'px at '+x+'% '+y+'%,rgba(255,255,255,'+(.4+Math.random()*.6)+'),transparent)')}document.documentElement.style.setProperty('--st',sh.join(','))}
/* ---------- data ---------- */
const NAT=[{n:['Ruby Dragons','Rồng Hồng Ngọc'],c:'#d7261e',c2:'#ff8a7a',e:'1f409',cap:['Metre Citadel','Thành Mét']},
 {n:['Sapphire Dolphins','Cá Heo Lam Ngọc'],c:'#1d5fd6',c2:'#8fc2ff',e:'1f42c',cap:['Centimetre Harbour','Cảng Xăng-ti-mét']},

let AC=null,SOUND=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t,d,type,v){if(!SOUND||!ac())return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime+t);g.gain.linearRampToValueAtTime(v||.2,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.05)}
function boom(t,v){if(!SOUND||!ac())return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,AC.currentTime+t);o.frequency.exponentialRampToValueAtTime(45,AC.currentTime+t+.3);g.gain.setValueAtTime(v||.5,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+.4);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.45)}
